<style>

</style></head><body>
<div class="header"><div style="display:flex;align-items:center;gap:10px"><img src="logo.jpg" class="logo-box" onerror="this.style.display='none'"><div><h2 style="margin:0;color:gold;font-size:18px">সোণৰ অসম</h2><p style="margin:0;color:#aaa;font-size:10px">Official • Premium</p></div></div><div id="authArea"></div></div>
<div class="districts" id="districtList"></div><div id="feed"></div><div id="reelsFeed" style="display:none"></div>

<div id="profilePage"><div class="profileHeader">
<div style="display:flex;justify-content:space-between;margin-bottom:15px"><button onclick="closeProfile()" style="padding:7px 14px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #444">Back</button><button onclick="logout()" style="padding:7px 14px;border-radius:20px;background:#ff2222;color:#fff;border:0">Logout</button></div>
<div id="bigPicArea"></div><h2 id="profName" style="color:gold;margin:10px 0"></h2>
<button onclick="uploadProfile()" style="margin-top:6px;padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:800;border:0">📷 Profile Photo</button>

<div style="padding:10px">
<div class="membership-real" id="membershipCard">
  <img src="card-bg.jpg" style="width:100%;height:100%;object-fit:cover;display:block" alt="card">
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;">
    <div style="margin-top:31%;width:22%;aspect-ratio:1/1;border-radius:50%;border:4px solid #d4af37;overflow:hidden;background:#111;box-shadow:0 0 15px gold;display:flex;align-items:center;justify-content:center">
      <img id="cardProfileImg" src="" style="width:100%;height:100%;object-fit:cover;display:none">

    </div>
    <div id="cardName" style="margin-top:2.5%;color:#fff;font-size:22px;font-weight:900;text-align:center;text-shadow:0 2px 8px rgba(255,215,0,0.8);font-family:serif;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Hamidul Islam</div>
  </div>
</div>
<div style="text-align:center;margin-top:12px">
  <button onclick="downloadCard()" style="padding:11px 24px;border-radius:25px;background:linear-gradient(135deg,gold,#ff8c00);color:#000;font-weight:900;border:0;box-shadow:0 4px 15px rgba(255,215,0,0.5)">⬇️ Download HD Card</button>
  <p style="color:#666;font-size:10px;margin-top:8px">ID: <span id="cardIdShow">SA-0000</span> • <span id="cardDistrictShow">All Assam</span> • <span id="cardSince">2024</span></p>
  <span id="cardId" style="display:none"></span><span id="cardDistrict" style="display:none"></span>
</div>
</div>

<div class="statBox"><div><b id="myPostCount">0</b><span style="font-size:11px;color:#888">Posts</span></div><div><b id="myLikeCount">0</b><span style="font-size:11px;color:#888">Likes</span></div><div><b id="myCommentCount">0</b><span style="font-size:11px;color:#888">Comments</span></div></div>
</div><div style="padding:10px"><h3 style="color:gold;padding:0 10px">মোৰ Posts</h3><div id="myPosts"></div></div></div>

<div class="bottom-nav">
<button class="active" onclick="switchTab('home',this)"><span class="icon">🏠</span>Home</button>
<button onclick="switchTab('reels',this)"><span class="icon">🎵</span>Reels</button>
<div class="upload-center" onclick="openReelsUpload()">+</div>
<button onclick="toggleInbox()"><span class="icon">💬</span>Inbox</button>
<button onclick="openProfilePage()"><span class="icon">👤</span>Profile</button>
</div>

<div id="reelsModal"><div class="reelsBox">
<h3 style="color:gold;text-align:center;margin:0 0 12px 0">HD Reels Upload</h3>
<input type="file" id="reelFile" accept="video/*,audio/*" style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px">
<input type="text" id="reelTitle" placeholder="গানৰ নাম লিখা..." style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px">
<select id="reelDist" style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px"></select>
<div class="progressBar" id="progBar"><div class="progressFill" id="progFill"></div></div>
<p id="uploadStatus" style="font-size:12px;color:#aaa;text-align:center;margin:8px 0"></p>
<div style="display:flex;gap:8px"><button onclick="closeReelsUpload()" style="flex:1;padding:10px;border-radius:20px;background:#222;color:#fff;border:1px solid #444">Cancel</button><button onclick="uploadReelNow()" style="flex:1;padding:10px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">Upload</button></div>
</div></div>

<div id="privateBox"><div style="background:#000;padding:10px;display:flex;justify-content:space-between;color:gold;font-weight:900;border-bottom:2px solid gold"><span id="privateTitle">Inbox</span><div><span onclick="backToInbox()" style="cursor:pointer;margin-right:8px;font-size:11px;background:#222;padding:4px 8px;border-radius:10px">Inbox</span><span onclick="toggleInbox()" style="cursor:pointer">X</span></div></div><div id="inboxList" style="max-height:100px;overflow-y:auto;background:#0a0a0a;padding:6px"></div><div id="privateMessages" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#000"></div><div style="display:flex;gap:6px;padding:10px;background:#151515"><input id="privateText" placeholder="Message..." style="flex:1;padding:10px;border-radius:20px;border:2px solid gold"><button onclick="sendPrivate()" style="width:42px;height:42px;border-radius:50%;background:gold;border:0">></button></div></div>
<input type="file" id="profileFile" accept="image/*" style="display:none"><input type="file" id="postImageFile" accept="image/*" style="display:none">

<script>
const firebaseConfig={apiKey:"AIzaSyDuJdr6IRg6U7FgQDIcZEG7IOMkinGxitI",authDomain:"sonor-assam.firebaseapp.com",projectId:"sonor-assam",storageBucket:"sonor-assam.appspot.com",messagingSenderId:"353015301976",appId:"1:353015301976:web:b7cc25039edb136a8c872d"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let currentUser=JSON.parse(localStorage.getItem('sonor_user')||'null');
function getProfileKey(){if(!currentUser)return 'sonor_profile_pic_guest';return 'sonor_profile_pic_'+(currentUser.phone||'')+'_'+(currentUser.name||'').toLowerCase().replace(/\s+/g,'');}
let profilePic="";function loadProfilePic(){profilePic=localStorage.getItem(getProfileKey())||"";}loadProfilePic();
let allPosts=[],allReels=[],privateTarget=null,inboxOpen=false,currentTab='home',selectedPostImage="",postImageFileObj=null;
const allDistricts=["Bajali","Baksa","Barpeta","Biswanath","Bongaigaon","Cachar","Charaideo","Chirang","Darrang","Dhemaji","Dhubri","Dibrugarh","Dima Hasao","Goalpara","Golaghat","Hailakandi","Hojai","Jorhat","Kamrup","Kamrup Metro","Karbi Anglong","Karimganj","Kokrajhar","Lakhimpur","Majuli","Morigaon","Nagaon","Nalbari","Sivasagar","Sonitpur","South Salmara","Tamulpur","Tinsukia","Udalguri","West Karbi Anglong"];
document.getElementById('districtList').innerHTML='<button class="active" onclick="filterByDistrict(\'All\',this)">All Assam</button>'+allDistricts.map(d=>`<button onclick="filterByDistrict('${d}',this)">${d}</button>`).join('');
document.getElementById('reelDist').innerHTML='<option value="">জিলা</option>'+allDistricts.map(d=>`<option>${d}</option>`).join('');
let selectedDistrict="All";
function filterByDistrict(n,b){selectedDistrict=n;document.querySelectorAll('.districts button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderFeed();renderReels();}
function switchTab(t,e){
  currentTab=t;
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
  if(e) e.classList.add('active');
  const homeFeed=document.getElementById('feed');
  const reelsFeed=document.getElementById('reelsFeed');
  const districtList=document.getElementById('districtList');
  if(t==='home'){homeFeed.style.display='block';reelsFeed.style.display='none';districtList.style.display='flex';renderFeed();}
  else if(t==='reels'){homeFeed.style.display='none';reelsFeed.style.display='block';districtList.style.display='flex';renderReels();}
  window.scrollTo({top:0,behavior:'smooth'});
}
function openReelsUpload(){if(!currentUser){openAuth();return;}document.getElementById('reelsModal').style.display='flex';}
function closeReelsUpload(){document.getElementById('reelsModal').style.display='none';document.getElementById('uploadStatus').innerText='';document.getElementById('progBar').style.display='none';document.getElementById('progFill').style.width='0%';}

// VIDEO UPLOAD 5-SERVER FIXED
async function uploadReelNow(){
  const file=document.getElementById('reelFile').files[0];
  const title=document.getElementById('reelTitle').value.trim();
  const status=document.getElementById('uploadStatus');
  const bar=document.getElementById('progBar');
  const fill=document.getElementById('progFill');
  if(!file){alert('Video Select কৰা!');return;}
  if(!title){alert('গানৰ নাম লিখা!');return;}
  if(file.size>80000000){alert('Video 80MB তকৈ ডাঙৰ! 60 Sec কৰা!');return;}
  bar.style.display='block';fill.style.width='5%';status.innerText='Uploading...';
  let videoUrl="";
  const uploaders=[
    {name:'0x0.st',url:'https://0x0.st',getUrl:async(r)=>(await r.text()).trim(),build:(f)=>{const fd=new FormData();fd.append('file',f);return fd;}},
    {name:'Catbox',url:'https://catbox.moe/user/api.php',getUrl:async(r)=>(await r.text()).trim(),build:(f)=>{const fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',f);return fd;}},
    {name:'File.io',url:'https://file.io',getUrl:async(r)=>{const j=await r.json();return j.link||"";},build:(f)=>{const fd=new FormData();fd.append('file',f);return fd;}},
    {name:'Tmpfiles',url:'https://tmpfiles.org/api/v1/upload',getUrl:async(r)=>{const j=await r.json();let u=j.data?.url||"";if(u)u=u.replace('tmpfiles.org/','tmpfiles.org/dl/');return u;},build:(f)=>{const fd=new FormData();fd.append('file',f);return fd;}},
    {name:'Gofile',url:'https://api.gofile.io/uploadFile',getUrl:async(r)=>{const j=await r.json();return j.data?.directLink||j.data?.downloadPage||"";},build:(f)=>{const fd=new FormData();fd.append('file',f);return fd;}}
  ];
  for(let i=0;i<uploaders.length;i++){
    const u=uploaders[i];
    try{
      const pct=10+i*18;fill.style.width=pct+'%';status.innerText=`${u.name} Try ${pct}%...`;
      const fd=u.build(file);
      const resp=await fetch(u.url,{method:'POST',body:fd});
      if(!resp.ok) continue;
      let finalUrl=await u.getUrl(resp);
      if(finalUrl&&finalUrl.startsWith('http')){videoUrl=finalUrl;break;}
    }catch(e){continue;}
  }
  if(!videoUrl){bar.style.display='none';alert('সকলো Server Busy! Video Size 50-60 Sec কৰি আকৌ চেষ্টা কৰা!');return;}
  try{
    fill.style.width='95%';status.innerText='Saving 95%...';
    await db.collection('reels').add({title:title,url:videoUrl,type:'video',district:document.getElementById('reelDist').value||selectedDistrict,userName:currentUser.name,userPhoto:profilePic||'',likes:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    fill.style.width='100%';status.innerText='✅ SUCCESS!';
    setTimeout(()=>{closeReelsUpload();document.getElementById('reelFile').value='';document.getElementById('reelTitle').value='';switchTab('reels',document.querySelectorAll('.bottom-nav button')[1]);},1000);
  }catch(e){alert('DB Error: '+e.message);bar.style.display='none';}
}

db.collection("reels").orderBy("createdAt","desc").limit(100).onSnapshot(s=>{allReels=[];s.forEach(d=>allReels.push({id:d.id,...d.data()}));if(currentTab==='reels')renderReels();});
function renderReels(){
  const feed=document.getElementById('reelsFeed');
  let filtered=selectedDistrict==="All"?allReels:allReels.filter(p=>p.district===selectedDistrict);
  if(!filtered.length){feed.innerHTML='<div class="card" style="text-align:center;color:#888;padding:30px">Reels নাই</div>';return;}
  feed.innerHTML=filtered.map(d=>{
    let media=`<video src="${d.url}" controls playsinline style="width:100%;max-height:500px;background:#000"></video>`;
    if(d.url.includes('gofile.io')) media=`<div style="padding:30px;text-align:center"><a href="${d.url}" target="_blank" style="padding:12px 24px;background:gold;color:#000;border-radius:25px;text-decoration:none;font-weight:900">▶️ Watch Video</a></div>`;
    return `<div class="reel-card">${media}<div style="padding:10px;display:flex;justify-content:space-between"><div><b style="color:gold">${d.title}</b><br><span style="font-size:11px;color:#888">${d.userName} • ${d.district||''}</span></div><button onclick="likeReel('${d.id}',${d.likes||0})" style="background:#1a1a1a;border:1px solid gold;border-radius:20px;padding:6px 12px;color:gold">❤️ ${d.likes||0}</button></div></div>`;
  }).join('');
}
function likeReel(id,l){if(!currentUser){openAuth();return;}const k='liked_reel_'+id;if(localStorage.getItem(k)){alert("Like কৰিছাই");return;}db.collection("reels").doc(id).update({likes:(l||0)+1});localStorage.setItem(k,'1');}
function renderAuth(){loadProfilePic();const area=document.getElementById('authArea');if(currentUser){area.innerHTML=profilePic?`<img src="${profilePic}" class="profile-pic" onclick="openProfilePage()">`:`<div class="profile-pic" onclick="openProfilePage()">${currentUser.name[0]}</div>`;}else{area.innerHTML=`<button onclick="openAuth()" style="padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">Login</button>`;}}
function openAuth(){let n=prompt("নাম?");if(!n)return;let p=prompt("মোবাইল?");if(!p)return;currentUser={name:n.trim(),phone:p.trim()};localStorage.setItem('sonor_user',JSON.stringify(currentUser));loadProfilePic();renderAuth();renderFeed();}
function logout(){if(!confirm("Logout?"))return;localStorage.removeItem('sonor_user');currentUser=null;profilePic="";closeProfile();renderAuth();renderFeed();}
function uploadProfile(){if(!currentUser){openAuth();return;}document.getElementById('profileFile').click();}
document.getElementById('profileFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const b=await new Promise(r=>{let fr=new FileReader();fr.onload=ev=>r(ev.target.result);fr.readAsDataURL(f);});profilePic=b;localStorage.setItem(getProfileKey(),b);renderAuth();openProfilePage();renderFeed();});
function getStableMemberId(){
  if(!currentUser) return "SA-0000";
  const stored=localStorage.getItem('sonor_member_id_'+currentUser.phone);
  if(stored) return stored;
  const phone=(currentUser.phone||"0000").slice(-4);
  const nameCode=(currentUser.name||"AX").substring(0,2).toUpperCase();
  const newId=`SA-${phone}-${nameCode}${Math.floor(100+Math.random()*900)}`;
  localStorage.setItem('sonor_member_id_'+currentUser.phone,newId);
  return newId;
}
function openProfilePage(){
  if(!currentUser){openAuth();return;}
  loadProfilePic();
  document.getElementById('profilePage').style.display='block';
  document.getElementById('bigPicArea').innerHTML=profilePic?`<img src="${profilePic}" class="bigPic">`:`<div class="bigPic" style="display:flex;align-items:center;justify-content:center;font-size:50px;background:radial-gradient(circle,gold,#ff8c00);color:#000;font-weight:900">${currentUser.name[0]}</div>`;
  document.getElementById('profName').innerText=currentUser.name;
  const my=allPosts.filter(p=>p.userName===currentUser.name);
  document.getElementById('myPostCount').innerText=my.length;
  document.getElementById('myLikeCount').innerText=my.reduce((s,p)=>s+(p.likes||0),0);
  document.getElementById('myCommentCount').innerText=my.reduce((s,p)=>s+(p.comments?.length||0),0);
  document.getElementById('myPosts').innerHTML=my.length?my.map(d=>`<div class="card"><p>${d.text||''}</p>${d.image?`<img src="${d.image}" style="width:100%;border-radius:12px">`:''}<br><button onclick="deletePost('${d.id}','${d.userName}')" style="background:#ff2222;color:#fff;border:0;border-radius:20px;padding:6px 12px;margin-top:8px">Delete</button></div>`).join(''):'<div class="card" style="text-align:center;color:#888">Post নাই</div>';

  try{
    const cpImg=document.getElementById('cardProfileImg');
    const cpLet=document.getElementById('cardProfileLetter');
    const cName=document.getElementById('cardName');
    const cId=document.getElementById('cardId');
    const cIdShow=document.getElementById('cardIdShow');
    const cDist=document.getElementById('cardDistrict');
    const cDistShow=document.getElementById('cardDistrictShow');
    const cSince=document.getElementById('cardSince');
    if(cName) cName.innerText=currentUser.name;
    const memId=getStableMemberId();
    if(cId) cId.innerText=memId;
    if(cIdShow) cIdShow.innerText=memId;
    if(cDist) cDist.innerText=selectedDistrict==="All"?"All Assam":selectedDistrict;
    if(cDistShow) cDistShow.innerText=selectedDistrict==="All"?"All Assam":selectedDistrict;
    if(cSince) cSince.innerText=new Date().getFullYear();
    if(profilePic && cpImg){
      cpImg.src=profilePic; cpImg.style.display='block';
      if(cpLet) cpLet.style.display='none';
    }else if(cpLet){
      cpLet.innerText=currentUser.name[0].toUpperCase();
      cpLet.style.display='block';
      if(cpImg) cpImg.style.display='none';
    }
  }catch(e){}
}
function closeProfile(){document.getElementById('profilePage').style.display='none';}
function downloadCard(){
  const card=document.getElementById('membershipCard');
  html2canvas(card,{backgroundColor:null,scale:3,useCORS:true,allowTaint:true}).then(canvas=>{
    const link=document.createElement('a');
    link.download=`Sonor-Axom-${currentUser.name}-Card.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
  }).catch(()=>{alert('Screenshot লোৱা - Power + Volume Down');});
}
function deletePost(id,o){if(o!==currentUser.name){alert("আনৰ Post নোৱাৰি!");return;}if(confirm("Delete?"))db.collection("posts").doc(id).delete();}
function likePost(id,l){if(!currentUser){openAuth();return;}const k='liked_'+id;if(localStorage.getItem(k)){alert("Like কৰিছাই");return;}db.collection("posts").doc(id).update({likes:(l||0)+1});localStorage.setItem(k,'1');}
async function commentPost(id){if(!currentUser){openAuth();return;}const t=prompt("Comment:");if(!t)return;const s=await db.collection("posts").doc(id).get();let c=s.data().comments||[];c.push({text:t,user:currentUser.name});await db.collection("posts").doc(id).update({comments:c});}
function toggleInbox(){inboxOpen=!inboxOpen;document.getElementById('privateBox').style.display=inboxOpen?'flex':'none';}
function openPrivateChat(t){if(!currentUser){openAuth();return;}if(t===currentUser.name){alert("নিজকে নোৱাৰি");return;}privateTarget=t;document.getElementById('privateTitle').innerText=t;document.getElementById('privateBox').style.display='flex';inboxOpen=true;listenPrivate();}
function backToInbox(){privateTarget=null;document.getElementById('privateTitle').innerText="Inbox";}
function getConvId(a,b){return [a.trim().toLowerCase(),b.trim().toLowerCase()].sort().join("__");}
function listenPrivate(){if(!privateTarget||!currentUser)return;const convId=getConvId(currentUser.name,privateTarget);db.collection("private_messages").where("convId","==",convId).orderBy("createdAt","asc").onSnapshot(s=>{const box=document.getElementById('privateMessages');box.innerHTML="";s.forEach(doc=>{const d=doc.data();box.innerHTML+=`<div style="max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;${d.from===currentUser.name?'align-self:flex-end;background:gold;color:#000;margin-left:auto':'align-self:flex-start;background:#222;color:#fff'}">${d.text}</div>`;});box.scrollTop=box.scrollHeight;});}
function sendPrivate(){if(!currentUser){openAuth();return;}if(!privateTarget){alert("User Select কৰা");return;}const txt=document.getElementById('privateText').value.trim();if(!txt)return;db.collection("private_messages").add({convId:getConvId(currentUser.name,privateTarget),from:currentUser.name,to:privateTarget,participants:[currentUser.name.toLowerCase(),privateTarget.toLowerCase()],text:txt,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('privateText').value="";}
db.collection("posts").orderBy("createdAt","desc").limit(100).onSnapshot(s=>{allPosts=[];s.forEach(d=>allPosts.push({id:d.id,...d.data()}));renderFeed();if(document.getElementById('profilePage').style.display==='block')openProfilePage();});

function renderFeed(){
  const feed=document.getElementById('feed');let filtered=selectedDistrict==="All"?allPosts:allPosts.filter(p=>p.district===selectedDistrict);
  feed.innerHTML=`<div class="card"><textarea id="postText" placeholder="কি ভাবিছা?" style="width:100%;min-height:60px;border-radius:12px;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333;box-sizing:border-box"></textarea><div style="display:flex;gap:6px;margin-top:8px"><select id="fDist" style="flex:1;padding:9px;border-radius:20px;border:2px solid gold;background:#fff;color:#000;font-weight:700"><option value="">জিলা</option>${allDistricts.map(d=>`<option ${d===selectedDistrict?'selected':''}>${d}</option>`).join('')}</select><button onclick="document.getElementById('postImageFile').click()" style="padding:9px 12px;border-radius:20px;background:#222;color:gold;border:1px solid gold">📷 Image</button><button onclick="createPostReal()" style="padding:9px 16px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">Post</button></div><div id="postImgPreview" style="margin-top:8px"></div></div>`+filtered.map(d=>{
    const liked=localStorage.getItem('liked_'+d.id);
    let avatar=d.userPhoto?`<img src="${d.userPhoto}" style="width:30px;height:30px;border-radius:50%;border:1px solid gold">`:`<div style="width:30px;height:30px;border-radius:50%;background:gold;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900">${(d.userName||'U')[0]}</div>`;
    if(currentUser&&d.userName===currentUser.name&&profilePic) avatar=`<img src="${profilePic}" style="width:30px;height:30px;border-radius:50%;border:1px solid gold">`;
    const commentsHtml=(d.comments||[]).map(c=>`<div style="margin-top:6px;padding:6px 10px;background:#1a1a1a;border-radius:10px;font-size:13px"><b>${c.user}:</b> ${c.text}</div>`).join('');
    const delBtn=(currentUser&&d.userName===currentUser.name)?`<button onclick="deletePost('${d.id}','${d.userName}')" class="btn-action" style="background:#ff2222">Delete</button>`:'';
    return `<div class="card"><div style="display:flex;align-items:center;gap:8px"><div style="display:flex;align-items:center;gap:8px">${avatar}<b>${d.userName}</b></div><span style="color:#888;font-size:11px">• ${d.district||''}</span></div><p style="margin:10px 0">${d.text||''}</p>${d.image?`<img src="${d.image}" style="width:100%;border-radius:12px;max-height:450px;object-fit:cover">`:''}<div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap"><button onclick="likePost('${d.id}',${d.likes||0})" class="btn-action" style="background:${liked?'gold':'#1a1a1a'};color:${liked?'#000':'#fff'}">❤️ Like ${d.likes||0}</button><button onclick="commentPost('${d.id}')" class="btn-action">💬 Comment ${(d.comments||[]).length}</button><button onclick="openPrivateChat('${d.userName}')" class="btn-action" style="border-color:gold;color:gold">💬 Inbox</button>${delBtn}</div>${commentsHtml}</div>`;
  }).join('');
  const imgInp=document.getElementById('postImageFile');
  if(imgInp && !imgInp._bound){
    imgInp._bound=true;
    imgInp.addEventListener('change',e=>{
      postImageFileObj=e.target.files[0];
      if(!postImageFileObj) return;
      const fr=new FileReader();
      fr.onload=ev=>{
        selectedPostImage=ev.target.result;
        const pv=document.getElementById('postImgPreview');
        if(pv) pv.innerHTML=`<div style="position:relative"><img src="${ev.target.result}" style="width:100%;max-height:300px;border-radius:12px"><button onclick="clearPostImage()" style="position:absolute;top:8px;right:8px;padding:6px 12px;border-radius:20px;background:#ff2222;color:#fff;border:0">X</button></div>`;
      };
      fr.readAsDataURL(postImageFileObj);
    });
  }
}
function clearPostImage(){selectedPostImage="";postImageFileObj=null;const p=document.getElementById('postImgPreview');if(p) p.innerHTML="";const i=document.getElementById('postImageFile');if(i) i.value="";}

// PHOTO UPLOAD 5-SERVER FIXED
async function createPostReal(){
  if(!currentUser){openAuth();return;}
  const txtEl=document.getElementById('postText');
  const txt=txtEl?txtEl.value.trim():"";
  const distEl=document.getElementById('fDist');
  const dist=distEl?distEl.value||selectedDistrict:selectedDistrict;
  if(!txt && !postImageFileObj && !selectedPostImage){alert("লিখা বা Photo দিয়া!");return;}
  if(txtEl) txtEl.placeholder="Uploading Photo...";
  let finalImg="";
  if(postImageFileObj){
    if(postImageFileObj.size>15000000){alert('Photo 15MB তকৈ ডাঙৰ!'); if(txtEl) txtEl.placeholder="কি ভাবিছা?"; return;}
    const uploaders=[
      {name:'0x0.st',url:'https://0x0.st',getUrl:async(r)=>(await r.text()).trim(),build:(f)=>{const fd=new FormData();fd.append('file',f);return fd;}},
      {name:'Catbox',url:'https://catbox.moe/user/api.php',getUrl:async(r)=>(await r.text()).trim(),build:(f)=>{const fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',f);return fd;}},
      {name:'File.io',url:'https://file.io',getUrl:async(r)=>{const j=await r.json();return j.link||"";},build:(f)=>{const fd=new FormData();fd.append('file',f);return fd;}},
      {name:'Tmpfiles',url:'https://tmpfiles.org/api/v1/upload',getUrl:async(r)=>{const j=await r.json();let u=j.data?.url||"";if(u)u=u.replace('tmpfiles.org/','tmpfiles.org/dl/');return u;},build:(f)=>{const fd=new FormData();fd.append('file',f);return fd;}}
    ];
    for(let i=0;i<uploaders.length;i++){
      const u=uploaders[i];
      try{
        if(txtEl) txtEl.placeholder=`${u.name} ${10+i*20}%...`;
        const fd=u.build(postImageFileObj);
        const resp=await fetch(u.url,{method:'POST',body:fd});
        if(!resp.ok) continue;
        let url=await u.getUrl(resp);
        if(url&&url.startsWith('http')){finalImg=url;break;}
      }catch(e){continue;}
    }
    if(!finalImg){alert('Photo Server Busy! 10MB কৰি চেষ্টা কৰা!'); if(txtEl) txtEl.placeholder="কি ভাবিছা?"; return;}
  }
  try{
    await db.collection("posts").add({text:txt,image:finalImg||"",district:dist,likes:0,comments:[],userName:currentUser.name,userPhoto:profilePic||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    if(txtEl){txtEl.value="";txtEl.placeholder="কি ভাবিছা?";}
    clearPostImage();
  }catch(err){alert('Error: '+err.message);if(txtEl) txtEl.placeholder="কি ভাবিছা?";}
}
renderAuth();
</script></body></html>
