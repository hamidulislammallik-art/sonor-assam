    return `<div class="card"><div style="display:flex;align-items:center;gap:8px;justify-content:space-between"><div style="display:flex;align-items:center;gap:8px">${avatar}<div><b>${d.userName}</b><br><span style="color:#888;font-size:10px">${d.district||''}</span></div></div>${followBtn}</div><p style="margin:10px 0">${d.text||''}</p>${mediaHtml}<div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap"><button onclick="likePost('${d.id}',${d.likes||0})" class="btn-action" style="background:${liked?'gold':'#1a1a1a'};color:${liked?'#000':'#fff'}">❤️ ${d.likes||0}</button><button onclick="commentPost('${d.id}')" class="btn-action">💬 ${(d.comments||[]).length}</button><button onclick="openPrivateChat('${d.userName}')" class="btn-action" style="border-color:gold;color:gold">💬 Inbox</button>${delBtn}</div>${commentsHtml}</div>`;
  }).join('');
  let imgInp=document.getElementById('postImageFile'); if(imgInp && !imgInp._bound){imgInp._bound=true;imgInp.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;let compressed=await compressImage(file,1920,0.85);selectedPostImage=compressed;let pv=document.getElementById('postImgPreview');if(pv) pv.innerHTML=`<div style="position:relative"><img src="${compressed}" style="width:100%;max-height:400px;border-radius:12px"><button onclick="clearPostImage()" style="position:absolute;top:8px;right:8px;padding:6px 12px;border-radius:20px;background:#ff2222;color:#fff;border:0">X</button></div>`;});}
  let audInp=document.getElementById('postAudioFile'); if(audInp && !audInp._bound2){audInp._bound2=true;audInp.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;if(file.size>25*1024*1024){alert('25MB!');return;}selectedPostAudio=file;selectedPostAudioUrl="";let pv=document.getElementById('postAudioPreview');if(pv) pv.innerHTML=`<div style="background:#1a1a1a;padding:8px 12px;border-radius:12px;border:1px solid #ff69b4;display:flex;justify-content:space-between;align-items:center"><span style="color:#ff69b4;font-size:12px">🎵 ${file.name} (${(file.size/1024/1024).toFixed(1)}MB)</span><button onclick="clearPostAudio()" style="background:#ff2222;color:#fff;border:0;border-radius:10px;padding:4px 8px">X</button></div>`;});}
  setTimeout(()=>renderSongsList('All'), 80);
  }catch(err){document.getElementById('feed').innerHTML='<div class="card" style="color:red">Error: '+err.message+'</div>';}
}
function clearPostImage(){selectedPostImage="";let p=document.getElementById('postImgPreview');if(p) p.innerHTML="";let i=document.getElementById('postImageFile');if(i) i.value="";}
function clearPostAudio(){selectedPostAudio=null;selectedPostAudioUrl="";let p=document.getElementById('postAudioPreview');if(p) p.innerHTML="";let i=document.getElementById('postAudioFile');if(i) i.value="";let s=document.getElementById('allSongsSelect');if(s) s.selectedIndex=0;}
async function createPostReal(){
  if(!currentUser){openAuth();return;} let txtEl=document.getElementById('postText');let txt=txtEl?txtEl.value.trim():""; let dist=document.getElementById('fDist')?document.getElementById('fDist').value||selectedDistrict:selectedDistrict;
  if(!txt && !selectedPostImage && !selectedPostAudio && !selectedPostAudioUrl){alert("লিখা, Photo বা গীত দিয়া!");return;} if(txtEl) txtEl.placeholder="Uploading...";
  try{
    let audioUrl = selectedPostAudioUrl || "";
    if(selectedPostAudio && !audioUrl){ let fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',selectedPostAudio); let resp=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd}); audioUrl=(await resp.text()).trim(); if(!audioUrl.startsWith('http')) throw new Error('Audio fail'); }
    await db.collection("posts").add({text:txt,image:selectedPostImage||"",audio:audioUrl||"",district:dist,likes:0,comments:[],userName:currentUser.name,userPhoto:profilePic||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    if(txtEl){txtEl.value="";txtEl.placeholder="কি ভাবিছা?";} clearPostImage();clearPostAudio();
  }catch(err){alert('Error: '+err.message); if(txtEl) txtEl.placeholder="কি ভাবিছা?";}
}
renderAuth();
</script></body></html>
