<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>সোণৰ অসম - অসমৰ নিজৰ এপ</title>
<link rel="icon" href="logo.png">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;padding-bottom:160px}
.header{padding:10px 14px;background:#0a0a0a;border-bottom:3px solid gold;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo-box{width:46px;height:46px;border-radius:12px;border:2px solid gold;object-fit:cover;background:linear-gradient(135deg,gold,#ff8c00)}
.profile-pic{width:38px;height:38px;border-radius:50%;border:2px solid gold;object-fit:cover;cursor:pointer;background:#222;display:flex;align-items:center;justify-content:center;font-weight:900;color:gold}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin:10px}
.btn-action{padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;border:1px solid #333;background:#1a1a1a;color:#fff}
#profilePage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:2000;display:none;overflow-y:auto}
.profileHeader{padding:20px;background:linear-gradient(180deg,#1a1a1a,#000);border-bottom:2px solid gold;text-align:center}
.bigPic{width:110px;height:110px;border-radius:50%;border:4px solid gold;object-fit:cover;margin:auto;background:#222;display:block}
.statBox{display:flex;justify-content:center;gap:12px;margin-top:15px}
.statBox div{background:#111;border:1px solid #222;border-radius:12px;padding:10px 16px;text-align:center;min-width:68px}
.statBox b{color:gold;font-size:18px;display:block}
#privateBox{position:fixed;bottom:180px;left:12px;width:92%;max-width:380px;height:460px;background:#111;border:2px solid gold;border-radius:18px;z-index:99998;display:none;flex-direction:column;overflow:hidden}
.chatHead{background:#000;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;color:gold;font-weight:900;border-bottom:2px solid gold}
#privateMessages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#000}
.pmsg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px}.pmsg.me{align-self:flex-end;background:gold;color:#000;font-weight:600}.pmsg.other{align-self:flex-start;background:#222;color:#fff;border:1px solid #333}
.chatInput{display:flex;gap:6px;padding:10px;background:#151515;border-top:1px solid #333}.chatInput input{flex:1;padding:10px 14px;border-radius:20px;border:2px solid gold;background:#fff;color:#000;font-weight:600;outline:none}
#inboxList{max-height:110px;overflow-y:auto;background:#0a0a0a;padding:6px;border-bottom:1px solid #222}.inboxItem{padding:7px 10px;background:#1a1a1a;margin:3px 0;border-radius:10px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between}
#scrollTopBtn{position:fixed;bottom:185px;right:20px;width:48px;height:48px;background:#1a1a1a;border:2px solid gold;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:99997;color:gold}
#scrollBottomBtn{position:fixed;bottom:110px;right:18px;width:48px;height:48px;background:#1a1a1a;border:2px solid gold;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:99997;color:gold}
.districts{display:flex;gap:8px;overflow-x:auto;padding:10px;scrollbar-width:none;background:#080808;border-bottom:1px solid #111}.districts::-webkit-scrollbar{display:none}.districts button{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid #2a2a2a;background:#151515;color:#aaa;font-size:12.5px}.districts button.active{background:gold;color:#000;font-weight:800}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:72px;background:#0a0a0a;border-top:2px solid gold;display:flex;justify-content:space-around;align-items:center;z-index:999999;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{background:transparent;border:0;color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:700}
.bottom-nav button.active{color:gold}
.bottom-nav button span.icon{font-size:22px}
.upload-center{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,gold,#ff8c00);border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;font-weight:900;margin-top:-28px;box-shadow:0 4px 15px rgba(255,215,0,0.7);cursor:pointer}
#reelsModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999999;display:none;align-items:center;justify-content:center;padding:15px}
.reelsBox{background:#111;border:2px solid gold;border-radius:18px;width:100%;max-width:380px;padding:18px}
.reelsBox h3{color:gold;margin:0 0 12px 0;text-align:center}
.reelsBox input,.reelsBox select{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;margin-bottom:10px;box-sizing:border-box}
.progressBar{width:100%;height:8px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px;display:none}
.progressFill{height:100%;background:gold;width:0%;transition:width 0.3s}
.reel-card{background:#111;border:1px solid gold;border-radius:16px;margin:10px;overflow:hidden}
.reel-card video,.reel-card audio{width:100%;display:block;background:#000}
.reel-info{padding:10px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <img src="logo.png" class="logo-box" id="mainLogo" onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src='logo.jpg';}else{this.style.display='none';document.getElementById('logoFallback').style.display='flex'}">
    <div id="logoFallback" style="width:46px;height:46px;border-radius:12px;border:2px solid gold;background:linear-gradient(135deg,gold,#ff8c00);display:none;align-items:center;justify-content:center;font-weight:900;color:#000">SA</div>
    <div style="line-height:1.1">
      <h2 style="margin:0;color:gold;font-size:19px;font-weight:900">সোণৰ অসম</h2>
      <p style="margin:2px 0 0 0;color:#aaa;font-size:11px;font-weight:600">অসমৰ নিজৰ এপ</p>
    </div>
  </div>
  <div id="authArea" style="display:flex;align-items:center;gap:8px"></div>
</div>

<div class="districts" id="districtList"></div>
<div id="feed"></div>
<div id="reelsFeed" style="display:none"></div>

<div id="profilePage">
  <div class="profileHeader">
    <div style="display:flex;justify-content:space-between;margin-bottom:15px"><button onclick="closeProfile()" style="padding:7px 14px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #444">← Back</button><button onclick="logout()" style="padding:7px 14px;border-radius:20px;background:#ff2222;color:#fff;border:0">Logout</button></div>
    <div id="bigPicArea"></div>
    <h2 id="profName" style="color:gold;margin:12px 0 4px 0"></h2>
    <p id="profBio" style="color:#aaa;margin:0;font-size:14px"></p>
    <div class="statBox"><div><b id="myPostCount">0</b><span style="font-size:11px;color:#888">Posts</span></div><div><b id="myLikeCount">0</b><span style="font-size:11px;color:#888">Likes</span></div><div><b id="myCommentCount">0</b><span style="font-size:11px;color:#888">Comments</span></div></div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button onclick="editProfile()" style="padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">✏️ Edit</button><button onclick="uploadProfile()" style="padding:8px 16px;border-radius:20px;background:#1a1a1a;color:gold;border:1px solid gold">📸 Photo</button></div>
    <div style="margin-top:28px;text-align:center">
      <h3 style="color:gold;margin-bottom:12px">💳 BOSS MEMBERSHIP CARD</h3>
      <canvas id="memberCanvas" width="1200" height="675" style="display:none"></canvas>
      <div id="cardPreview" style="background:#000;border:2px solid gold;border-radius:16px;padding:4px;min-height:220px;display:flex;align-items:center;justify-content:center;color:#666">Generating...</div>
      <a id="downloadCard" href="#" download="SonorAxom-Boss-Card.png" style="display:inline-block;margin-top:14px;background:linear-gradient(135deg,gold,#ff8c00);color:#000;padding:12px 28px;border-radius:25px;text-decoration:none;font-weight:900">📥 Boss Card Download</a>
    </div>
  </div>
  <div style="padding:10px"><h3 style="color:gold;padding:0 10px">📝 মোৰ Posts</h3><div id="myPosts"></div></div>
</div>

<div class="bottom-nav">
  <button class="active" onclick="switchTab('home',this)"><span class="icon">🏠</span>Home</button>
  <button onclick="switchTab('reels',this)"><span class="icon">🎵</span>Reels</button>
  <div class="upload-center" onclick="openReelsUpload()">+</div>
  <button onclick="toggleInbox()"><span class="icon">💬</span>Inbox</button>
  <button onclick="openProfilePage()"><span class="icon">👤</span>Profile</button>
</div>

<div id="reelsModal">
  <div class="reelsBox">
    <h3>🎵 Song Reels Upload</h3>
    <input type="file" id="reelFile" accept="video/*,audio/*">
    <input type="text" id="reelTitle" placeholder="গানৰ নাম / Title...">
    <select id="reelDist"><option>জিলা</option></select>
    <div class="progressBar" id="progBar"><div class="progressFill" id="progFill"></div></div>
    <p id="uploadStatus" style="font-size:12px;color:#aaa;text-align:center;margin:8px 0"></p>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="closeReelsUpload()" style="flex:1;padding:10px;border-radius:20px;background:#222;color:#fff;border:1px solid #444">Cancel</button>
      <button onclick="uploadReelNow()" style="flex:1;padding:10px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">🚀 Upload</button>
    </div>
  </div>
</div>

<div id="privateBox"><div class="chatHead"><span id="privateTitle">📩 Inbox</span><div><span onclick="backToInbox()" style="cursor:pointer;margin-right:8px;font-size:11px;background:#222;padding:4px 8px;border-radius:10px">Inbox</span><span onclick="toggleInbox()" style="cursor:pointer">✕</span></div></div><div id="inboxList"></div><div id="privateMessages"></div><div class="chatInput"><input id="privateText" placeholder="Message..." onkeypress="if(event.key==='Enter')sendPrivate()"><button onclick="sendPrivate()" style="width:42px;height:42px;border-radius:50%;background:gold;border:0">➤</button></div></div>
<input type="file" id="profileFile" accept="image/*" style="display:none">
<div id="scrollTopBtn" onclick="scrollToTop()">⬆️</div>
<div id="scrollBottomBtn" onclick="scrollToBottom()">⬇️</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDuJdr6IRg6U7FgQDIcZEG7IOMkinGxitI",
  authDomain: "sonor-assam.firebaseapp.com",
  projectId: "sonor-assam",
  storageBucket: "sonor-assam.appspot.com",
  messagingSenderId: "353015301976",
  appId: "1:353015301976:web:b7cc25039edb136a8c872d"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const storage=firebase.storage();
function getProfileKey(){if(!currentUser) return 'sonor_profile_pic_guest';return 'sonor_profile_pic_' + (currentUser.phone||'') + '_' + (currentUser.name||'').toLowerCase().replace(/\s+/g,'');}
let currentUser=JSON.parse(localStorage.getItem('sonor_user')||'null');
let profilePic="";function loadProfilePic(){const key=getProfileKey();profilePic=localStorage.getItem(key) || localStorage.getItem('sonor_profile_pic') || "";}loadProfilePic();
let userBio=localStorage.getItem('sonor_bio')||"জয় আই অসম!";let allPosts=[];let allReels=[];let privateTarget=null;let inboxOpen=false;let privateUnsub=null;let currentTab='home';
const allDistricts=["Bajali","Baksa","Barpeta","Biswanath","Bongaigaon","Cachar","Charaideo","Chirang","Darrang","Dhemaji","Dhubri","Dibrugarh","Dima Hasao","Goalpara","Golaghat","Hailakandi","Hojai","Jorhat","Kamrup","Kamrup Metro","Karbi Anglong","Karimganj","Kokrajhar","Lakhimpur","Majuli","Morigaon","Nagaon","Nalbari","Sivasagar","Sonitpur","South Salmara","Tamulpur","Tinsukia","Udalguri","West Karbi Anglong"];
const dList=document.getElementById('districtList');dList.innerHTML='<button class="active" onclick="filterByDistrict(\'All\',this)">All Assam</button>'+allDistricts.map(d=>`<button onclick="filterByDistrict('${d}',this)">${d}</button>`).join('');
document.getElementById('reelDist').innerHTML='<option value="">জিলা</option>'+allDistricts.map(d=>`<option>${d}</option>`).join('');
let selectedDistrict="All";
function filterByDistrict(name,btn){selectedDistrict=name;document.querySelectorAll('.districts button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderFeed();renderReels();}
function switchTab(tab,el){currentTab=tab;document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));if(el) el.classList.add('active');if(tab==='home'){document.getElementById('feed').style.display='block';document.getElementById('reelsFeed').style.display='none';}else{document.getElementById('feed').style.display='none';document.getElementById('reelsFeed').style.display='block';renderReels();}}
function openReelsUpload(){if(!currentUser){openAuth();return;}document.getElementById('reelsModal').style.display='flex';}
function closeReelsUpload(){document.getElementById('reelsModal').style.display='none';document.getElementById('uploadStatus').innerText='';document.getElementById('progBar').style.display='none';}
async function uploadReelNow(){
  const file=document.getElementById('reelFile').files[0];const title=document.getElementById('reelTitle').value.trim();const dist=document.getElementById('reelDist').value;
  if(!file){alert('Video/Audio select কৰা!');return;}if(!title){alert('গানৰ নাম দিয়া!');return;}
  const status=document.getElementById('uploadStatus');const bar=document.getElementById('progBar');const fill=document.getElementById('progFill');
  bar.style.display='block';status.innerText='Uploading... 0%';
  const fileName='reels/'+Date.now()+'_'+file.name;const ref=storage.ref().child(fileName);const task=ref.put(file);
  task.on('state_changed',snap=>{const pct=Math.round((snap.bytesTransferred/snap.totalBytes)*100);fill.style.width=pct+'%';status.innerText='Uploading... '+pct+'%';},err=>{status.innerText='Error: '+err.message;alert(err.message);},async()=>{const url=await ref.getDownloadURL();const isVideo=file.type.startsWith('video');await db.collection('reels').add({title:title,url:url,type:isVideo?'video':'audio',district:dist||selectedDistrict,userName:currentUser.name,userPhoto:profilePic||'',likes:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});status.innerText='Upload Success ✅';setTimeout(()=>{closeReelsUpload();switchTab('reels',document.querySelectorAll('.bottom-nav button')[1]);},800);document.getElementById('reelFile').value='';document.getElementById('reelTitle').value='';});
}
db.collection("reels").orderBy("createdAt","desc").limit(100).onSnapshot(snap=>{allReels=[];snap.forEach(d=>allReels.push({id:d.id,...d.data()}));if(currentTab==='reels') renderReels();});
function renderReels(){
  const feed=document.getElementById('reelsFeed');let filtered=selectedDistrict==="All"?allReels:allReels.filter(p=>p.district===selectedDistrict);
  if(filtered.length===0){feed.innerHTML='<div class="card" style="text-align:center;color:#888;padding:30px">🎵 এতিয়ালৈকে Reels নাই<br>প্ৰথম Reel তুমি Upload কৰা!</div>';return;}
  feed.innerHTML=filtered.map(d=>{const media=d.type==='video'?`<video src="${d.url}" controls playsinline style="max-height:480px"></video>`:`<audio src="${d.url}" controls style="width:100%"></audio><div style="text-align:center;font-size:48px;padding:20px">🎵</div>`;return `<div class="reel-card">${media}<div class="reel-info"><div><b style="color:gold">${d.title}</b><br><span style="font-size:11px;color:#888">${d.userName} • ${d.district||''}</span></div><button onclick="likeReel('${d.id}',${d.likes||0})" style="background:#1a1a1a;border:1px solid gold;border-radius:20px;padding:6px 12px;color:gold">❤️ ${d.likes||0}</button></div></div>`;}).join('');
}
function likeReel(id,l){if(!currentUser){openAuth();return;}const k='liked_reel_'+id;if(localStorage.getItem(k)){alert("Like কৰিছাই");return;}db.collection("reels").doc(id).update({likes:(l||0)+1});localStorage.setItem(k,'1');}
function renderAuth(){loadProfilePic();const area=document.getElementById('authArea');if(currentUser){const pic=profilePic?`<img src="${profilePic}" class="profile-pic" onclick="openProfilePage()">`:`<div class="profile-pic" onclick="openProfilePage()">${currentUser.name[0]}</div>`;area.innerHTML=`${pic}<span style="font-size:12px;cursor:pointer" onclick="openProfilePage()">${currentUser.name}</span>`;}else{area.innerHTML=`<button onclick="openAuth()" style="padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">🔐 Login</button>`;}}
function openAuth(){let n=prompt("নাম?");if(!n)return;let p=prompt("মোবাইল?");if(!p)return;currentUser={name:n.trim(),phone:p.trim()};localStorage.setItem('sonor_user',JSON.stringify(currentUser));loadProfilePic();renderAuth();renderFeed();}
function logout(){if(!confirm("Logout?"))return;localStorage.removeItem('sonor_user');currentUser=null;profilePic="";closeProfile();renderAuth();renderFeed();}
function uploadProfile(){if(!currentUser){openAuth();return;}document.getElementById('profileFile').click();}
document.getElementById('profileFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const b=await new Promise(r=>{let fr=new FileReader();fr.onload=ev=>r(ev.target.result);fr.readAsDataURL(f);});profilePic=b;localStorage.setItem(getProfileKey(),b);localStorage.setItem('sonor_profile_pic',b);renderAuth();openProfilePage();renderFeed();});
function loadImage(src){return new Promise(resolve=>{if(!src){resolve(null);return;}const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src;setTimeout(()=>resolve(null),2000);});}
async function generateMembershipCard(){if(!currentUser) return;const canvas=document.getElementById('memberCanvas');const ctx=canvas.getContext('2d');const preview=document.getElementById('cardPreview');preview.innerHTML="Generating...";let cardBg=await loadImage("card-bg.png?v="+Date.now());let avatarImg=null;if(profilePic) avatarImg=await loadImage(profilePic);ctx.clearRect(0,0,1200,675);if(cardBg){ctx.drawImage(cardBg,0,0,1200,675);}else{ctx.fillStyle="#050505";ctx.fillRect(0,0,1200,675);}const photoY=350;if(avatarImg){ctx.save();ctx.beginPath();ctx.arc(600,photoY,75,0,Math.PI*2);ctx.clip();ctx.drawImage(avatarImg,525,photoY-75,150,150);ctx.restore();ctx.beginPath();ctx.arc(600,photoY,78,0,Math.PI*2);ctx.strokeStyle="#FFD700";ctx.lineWidth=4;ctx.stroke();}const nameY=500;ctx.fillStyle="#f9e7b0";ctx.font="bold 54px Georgia";ctx.textAlign="center";ctx.shadowColor="black";ctx.shadowBlur=12;ctx.fillText(currentUser.name,600,nameY);ctx.shadowBlur=0;const dataUrl=canvas.toDataURL("image/png");preview.innerHTML=`<img src="${dataUrl}" style="width:100%;border-radius:12px;display:block">`;document.getElementById('downloadCard').href=dataUrl;document.getElementById('downloadCard').download=currentUser.name+"-SonorAxom-Boss.png";}
function openProfilePage(){if(!currentUser){openAuth();return;}loadProfilePic();document.getElementById('profilePage').style.display='block';document.getElementById('bigPicArea').innerHTML=profilePic?`<img src="${profilePic}" class="bigPic">`:`<div class="bigPic" style="display:flex;align-items:center;justify-content:center;font-size:40px">${currentUser.name[0]}</div>`;document.getElementById('profName').innerText=currentUser.name;document.getElementById('profBio').innerText=userBio;const myPosts=allPosts.filter(p=>p.userName===currentUser.name);document.getElementById('myPostCount').innerText=myPosts.length;document.getElementById('myLikeCount').innerText=myPosts.reduce((s,p)=>s+(p.likes||0),0);document.getElementById('myCommentCount').innerText=myPosts.reduce((s,p)=>s+(p.comments?.length||0),0);document.getElementById('myPosts').innerHTML=myPosts.length?myPosts.map(d=>`<div class="card"><p>${d.text}</p>${d.image?`<img src="${d.image}" style="width:100%;border-radius:12px">`:''}<div style="margin-top:8px;display:flex;gap:6px"><span style="background:#1a1a1a;padding:4px 10px;border-radius:12px;font-size:12px">👍 ${d.likes||0}</span><button onclick="deletePost('${d.id}','${d.userName}')" style="margin-left:auto;padding:5px 12px;border-radius:20px;background:#ff2222;color:#fff;border:0">🗑️ Delete</button></div></div>`).join(''):'<div class="card" style="text-align:center;color:#888">Post নাই</div>';setTimeout(generateMembershipCard,300);}
function closeProfile(){document.getElementById('profilePage').style.display='none';}
function editProfile(){let n=prompt("নাম:",currentUser.name);if(n&&n.trim()){currentUser.name=n.trim();localStorage.setItem('sonor_user',JSON.stringify(currentUser));}let b=prompt("Bio:",userBio);if(b!==null){userBio=b;localStorage.setItem('sonor_bio',b);}renderAuth();openProfilePage();renderFeed();}
function deletePost(id,ownerName){if(!currentUser){openAuth();return;}if(ownerName!==currentUser.name){alert("⛔ আনৰ Post Delete নোৱাৰি!");return;}if(confirm("Delete কৰিবা?")){db.collection("posts").doc(id).delete().then(()=>alert("Delete ✅"));}}
function likePost(id,l){if(!currentUser){openAuth();return;}const k='liked_'+id;if(localStorage.getItem(k)){alert("Like কৰিছাই");return;}db.collection("posts").doc(id).update({likes:(l||0)+1});localStorage.setItem(k,'1');}
async function commentPost(id){if(!currentUser){openAuth();return;}const t=prompt("Comment:");if(!t)return;const s=await db.collection("posts").doc(id).get();let c=s.data().comments||[];c.push({text:t,user:currentUser.name});await db.collection("posts").doc(id).update({comments:c});}
function sharePost(id,text){const url=location.href.split('#')[0]+'#'+id;if(navigator.share){navigator.share({title:'সোণৰ অসম',text:text.substring(0,80),url:url});}else{navigator.clipboard.writeText(url).then(()=>alert("Link Copy ✅")).catch(()=>prompt("Copy:",url));}}
function toggleInbox(){inboxOpen=!inboxOpen;document.getElementById('privateBox').style.display=inboxOpen?'flex':'none';if(inboxOpen)loadInbox();}
function openPrivateChat(t){if(!currentUser){openAuth();return;}if(t===currentUser.name){alert("নিজকে নোৱাৰি");return;}privateTarget=t;document.getElementById('privateTitle').innerText="🔒 "+t;document.getElementById('privateBox').style.display='flex';inboxOpen=true;document.getElementById('inboxList').style.display='none';listenPrivate();}
function backToInbox(){privateTarget=null;document.getElementById('privateTitle').innerText="📩 Inbox";document.getElementById('inboxList').style.display='block';loadInbox();if(privateUnsub)privateUnsub();}
function getConvId(a,b){return [a.trim().toLowerCase(),b.trim().toLowerCase()].sort().join("__");}
function listenPrivate(){if(!privateTarget||!currentUser)return;if(privateUnsub)privateUnsub();const convId=getConvId(currentUser.name,privateTarget);privateUnsub=db.collection("private_messages").where("convId","==",convId).orderBy("createdAt","asc").limit(100).onSnapshot(snap=>{const box=document.getElementById('privateMessages');box.innerHTML="";if(snap.empty){box.innerHTML=`<div style="text-align:center;color:#888;margin-top:30px">${privateTarget} ৰ লগত প্ৰথম Message 👋</div>`;return;}snap.forEach(doc=>{const d=doc.data();box.innerHTML+=`<div class="pmsg ${d.from===currentUser.name?'me':'other'}">${d.text}</div>`;});box.scrollTop=box.scrollHeight;});}
function sendPrivate(){if(!currentUser){openAuth();return;}if(!privateTarget){alert("User select");return;}const txt=document.getElementById('privateText').value.trim();if(!txt)return;db.collection("private_messages").add({convId:getConvId(currentUser.name,privateTarget),from:currentUser.name,to:privateTarget,participants:[currentUser.name.toLowerCase(),privateTarget.toLowerCase()],text:txt,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('privateText').value="";}
function loadInbox(){if(!currentUser)return;db.collection("private_messages").where("participants","array-contains",currentUser.name.toLowerCase()).orderBy("createdAt","desc").limit(50).onSnapshot(snap=>{const list=document.getElementById('inboxList');if(!snap.empty){let users={};snap.forEach(doc=>{const d=doc.data();const other=d.from===currentUser.name?d.to:d.from;if(!users[other])users[other]=d;});list.innerHTML=Object.keys(users).map(u=>`<div class="inboxItem" onclick="openPrivateChat('${u}')"><span>🔒 ${u}</span><span style="font-size:11px;color:#888">${users[u].text.substring(0,18)}</span></div>`).join('');}else{list.innerHTML='<div style="color:#888;font-size:12px;text-align:center;padding:8px">Inbox খালী</div>';}});}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}function scrollToBottom(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
window.addEventListener('scroll',()=>{const btn=document.getElementById('scrollTopBtn');if(window.scrollY>400)btn.style.display='flex';else btn.style.display='none';});
db.collection("posts").orderBy("createdAt","desc").limit(100).onSnapshot(snap=>{allPosts=[];snap.forEach(d=>allPosts.push({id:d.id,...d.data()}));renderFeed();if(document.getElementById('profilePage').style.display!=='none')openProfilePage();});
function renderFeed(){
  const feed=document.getElementById('feed');let filtered=selectedDistrict==="All"?allPosts:allPosts.filter(p=>p.district===selectedDistrict);
  feed.innerHTML=`<div class="card"><textarea id="postText" placeholder="কি ভাবিছা Boss?..." style="width:100%;min-height:60px;border-radius:12px;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333"></textarea><div style="display:flex;gap:6px;margin-top:8px"><select id="fDist" style="flex:1;padding:9px;border-radius:20px;border:2px solid gold;background:#fff;color:#000;font-weight:700"><option value="">জিলা</option>${allDistricts.map(d=>`<option>${d}</option>`).join('')}</select><input type="file" id="fImg" accept="image/*" style="flex:1"><button onclick="createPostReal()" style="padding:9px 16px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">Post</button></div></div>`+filtered.map(d=>{const liked=localStorage.getItem('liked_'+d.id);let avatar=d.userPhoto?`<img src="${d.userPhoto}" style="width:30px;height:30px;border-radius:50%;border:1px solid gold">`:`<div style="width:30px;height:30px;border-radius:50%;background:gold;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900">${(d.userName||'U')[0]}</div>`;if(currentUser&&d.userName===currentUser.name&&profilePic) avatar=`<img src="${profilePic}" style="width:30px;height:30px;border-radius:50%;border:1px solid gold">`;const commentsHtml=(d.comments||[]).map(c=>`<div style="margin-top:6px;padding:6px 10px;background:#1a1a1a;border-radius:10px;font-size:13px"><b>${c.user}:</b> ${c.text}</div>`).join('');const deleteBtn=(currentUser&&d.userName===currentUser.name)?`<button onclick="deletePost('${d.id}','${d.userName}')" class="btn-action" style="background:#ff2222">🗑️ Delete</button>`:``;return `<div class="card"><div style="display:flex;align-items:center;gap:8px"><div onclick="openPrivateChat('${d.userName}')" style="cursor:pointer;display:flex;align-items:center;gap:8px">${avatar}<b style="text-decoration:underline;text-decoration-color:gold">${d.userName||'User'}</b></div><span style="color:#888;font-size:11px">• ${d.district||''}</span></div><p style="margin:10px 0">${d.text||''}</p>${d.image?`<img src="${d.image}" style="width:100%;border-radius:12px;max-height:450px;object-fit:cover">`:''}<div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap"><button onclick="likePost('${d.id}',${d.likes||0})" class="btn-action" style="background:${liked?'gold':'#1a1a1a'};color:${liked?'#000':'#fff'}">👍 ${d.likes||0}</button><button onclick="commentPost('${d.id}')" class="btn-action">💬 ${(d.comments||[]).length}</button><button onclick="sharePost('${d.id}',\`${(d.text||'').replace(/`/g,'')}\`)" class="btn-action" style="color:gold;border-color:gold">↗️ Share</button>${deleteBtn}</div>${commentsHtml}</div>`;}).join('');
}
async function createPostReal(){if(!currentUser){openAuth();return;}loadProfilePic();const txt=document.getElementById('postText').value.trim();if(!txt){alert("লিখা");return;}let img="";let file=document.getElementById('fImg')?.files[0];if(file){img=await new Promise(r=>{let fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(file);});}await db.collection("posts").add({text:txt,image:img,district:document.getElementById('fDist')?.value||selectedDistrict,likes:0,comments:[],userName:currentUser.name,userPhoto:profilePic||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('postText').value="";}
renderAuth();loadInbox();
</script>
</body>
