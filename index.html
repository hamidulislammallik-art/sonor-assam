<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সোণৰ অসম</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui;min-height:100vh}
.top{position:sticky;top:0;z-index:30;background:#0f0f0f;border-bottom:3px solid gold;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.left{display:flex;align-items:center;gap:10px}.left img{width:52px;height:52px;border-radius:14px;border:2px solid gold}
.btn{padding:10px 18px;border-radius:24px;border:0;font-weight:800;cursor:pointer}.g{background:linear-gradient(90deg,gold,#FF8C00);color:#000;width:100%;margin-top:8px;font-size:16px}
.card{background:#151515;border:1px solid #333;border-radius:16px;padding:16px;margin:10px}
.stats{display:flex;gap:8px;padding:10px;background:#f5f2eb}.stats div{flex:1;background:#fff;color:#222;border-top:3px solid #ffcc66;border-radius:10px;padding:10px;text-align:center;font-weight:800}
.filters{display:flex;gap:8px;padding:10px;background:#f5f2eb}.filters select,.filters input{flex:1;padding:10px;border-radius:20px;border:1px solid #ddd;background:#fff}
.main{max-width:640px;margin:auto}
.post-img{width:100%;border-radius:12px;margin-top:10px;max-height:400px;object-fit:cover;border:1px solid #333}
.act{display:flex;gap:8px;margin-top:12px;border-top:1px solid #2a2a2a;padding-top:10px}
.act button{flex:1;padding:8px;border-radius:20px;border:1px solid #333;background:#222;color:#aaa;font-size:12px}
textarea,select,input[type=file]{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;margin:6px 0;font-size:15px}
#status{text-align:center;color:gold;font-weight:700;margin:8px 0}
</style>
</head>
<body>
<div class="top">
<div class="left"><img src="logo.jpg"><div><h1 style="color:gold;font-size:18px">সোণৰ অসম</h1><p style="color:#aaa;font-size:10px">অসমৰ নিজৰ App</p></div></div>
<div style="color:gold;font-weight:800">Live</div>
</div>
<div class="main">
<div class="stats"><div><span id="pcnt">0</span><br>Post</div><div>৩৩ জিলা</div><div>Live</div></div>
<div class="card">
<h4 style="color:gold">✍️ নতুন খবৰ দিয়ক</h4>
<select id="fDist"><option>Barpeta</option><option>Nalbari</option><option>Guwahati</option><option>Bongaigaon</option><option>Dhubri</option><option>Goalpara</option><option>Other</option></select>
<textarea id="postText" rows="3" placeholder="আজি কি হৈছে? লিখক..."></textarea>
<input type="file" id="postImage" accept="image/*">
<button class="btn g" onclick="uploadPost()">📢 Post কৰক</button>
<p id="status"></p>
</div>
<div class="filters">
<select id="filterDistrict"><option value="">সকলো জিলা</option><option>Barpeta</option><option>Nalbari</option><option>Guwahati</option><option>Bongaigaon</option><option>Dhubri</option></select>
<input id="searchBox" placeholder="Search...">
</div>
<div id="feed"></div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDuJdr6IRg6U7FgQDIcZEG7IOMkinGxitI",
  authDomain: "sonor-assam.firebaseapp.com",
  projectId: "sonor-assam",
  storageBucket: "sonor-assam.firebasestorage.app",
  messagingSenderId: "353015301976",
  appId: "1:353015301976:web:b7cc25039edb136a8c872d",
  measurementId: "G-84Z9492SRD"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
async function uploadPost(){
  const text=document.getElementById('postText').value.trim();
  if(!text){alert("Text লিখা Bos!");return;}
  const status=document.getElementById('status');
  status.innerText="⏳ Posting...";
  const file=document.getElementById('postImage').files[0];
  let imageBase64="";
  if(file){
    if(file.size>800000){alert("Photo 800KB তকৈ সৰু দিয়া");status.innerText="";return;}
    imageBase64=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
  }
  try{
    await db.collection("posts").add({text:text,image:imageBase64,district:document.getElementById('fDist').value,likes:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    status.innerText="✅ Success Bos! 🔥";document.getElementById('postText').value="";document.getElementById('postImage').value="";setTimeout(()=>status.innerText="",2500);
  }catch(err){status.innerText="❌ "+err.message;alert(err.message);}
}
let allPosts=[];
db.collection("posts").orderBy("createdAt","desc").limit(100).onSnapshot(snap=>{
  allPosts=[];snap.forEach(d=>allPosts.push({id:d.id,...d.data()}));
  document.getElementById('pcnt').innerText=snap.size;renderFeed();
});
function renderFeed(){
  const feed=document.getElementById('feed');
  const filterD=document.getElementById('filterDistrict').value;
  const search=document.getElementById('searchBox').value.toLowerCase();
  feed.innerHTML="";
  let filtered=allPosts.filter(p=>{
    if(filterD && p.district!==filterD) return false;
    if(search &&!p.text.toLowerCase().includes(search)) return false;
    return true;
  });
  if(filtered.length===0){feed.innerHTML='<div class="card" style="text-align:center;color:#888">কোনো Post নাই</div>';return;}
  filtered.forEach(data=>{
    const time=data.createdAt?data.createdAt.toDate().toLocaleString('en-IN'):'Just now';
    feed.innerHTML+=`<div class="card"><small style="color:gold">📍 ${data.district||'Assam'} • ${time}</small><p style="margin:10px 0;white-space:pre-wrap">${data.text}</p>${data.image?`<img class="post-img" src="${data.image}">`:''}<div class="act"><button>❤️ ${data.likes||0}</button><button>💬 Comment</button><button>↗️ Share</button></div></div>`;
  });
}
document.getElementById('filterDistrict').addEventListener('change',renderFeed);
document.getElementById('searchBox').addEventListener('input',renderFeed);
</script>
</body>
</html>
