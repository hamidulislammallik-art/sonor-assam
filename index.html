<!DOCTYPE html>
<html lang="as"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সোণৰ অসম</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;padding-bottom:160px}
.header{padding:10px 14px;background:#0a0a0a;border-bottom:3px solid gold;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo-box{width:46px;height:46px;border-radius:50%;border:2px solid gold;object-fit:cover;background:#000}
.profile-pic{width:38px;height:38px;border-radius:50%;border:2px solid gold;object-fit:cover;cursor:pointer;background:#222;display:flex;align-items:center;justify-content:center;font-weight:900;color:gold}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin:10px}
.btn-action{padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;border:1px solid #333;background:#1a1a1a;color:#fff}
#profilePage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:2000;display:none;overflow-y:auto}
.profileHeader{padding:20px;background:linear-gradient(180deg,#1a1a1a,#000);border-bottom:2px solid gold;text-align:center}
.bigPic{width:110px;height:110px;border-radius:50%;border:4px solid gold;object-fit:cover;margin:auto;background:#222;display:block}
.statBox{display:flex;justify-content:center;gap:12px;margin-top:15px}
.statBox div{background:#111;border:1px solid #222;border-radius:12px;padding:10px 16px;text-align:center;min-width:68px}
.statBox b{color:gold;font-size:18px;display:block}
.districts{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#080808;border-bottom:1px solid #111}
.districts button{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid #2a2a2a;background:#151515;color:#aaa;font-size:12.5px}
.districts button.active{background:gold;color:#000;font-weight:800}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:72px;background:#0a0a0a;border-top:2px solid gold;display:flex;justify-content:space-around;align-items:center;z-index:999999}
.bottom-nav button{background:transparent;border:0;color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:700}
.bottom-nav button.active{color:gold}
.bottom-nav button span.icon{font-size:22px}
.upload-center{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,gold,#ff8c00);border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;font-weight:900;margin-top:-28px;box-shadow:0 4px 15px rgba(255,215,0,0.7);cursor:pointer}
#reelsModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999999;display:none;align-items:center;justify-content:center;padding:15px}
.reelsBox{background:#111;border:2px solid gold;border-radius:18px;width:100%;max-width:380px;padding:18px}
.progressBar{width:100%;height:8px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px;display:none}
.progressFill{height:100%;background:gold;width:0%;transition:width 0.3s}
.reel-card{background:#111;border:1px solid gold;border-radius:16px;margin:10px;overflow:hidden}
#privateBox{position:fixed;bottom:180px;left:12px;width:92%;max-width:380px;height:460px;background:#111;border:2px solid gold;border-radius:18px;z-index:99998;display:none;flex-direction:column;overflow:hidden}
.membership-card-premium{background:#0a0a0a;border:2px solid #d4af37;border-radius:12px;padding:4px;margin:15px 10px;box-shadow:0 0 22px rgba(212,175,55,0.35)}
.premium-inner{background:#111;border:1px solid rgba(212,175,55,0.6);border-radius:8px;padding:18px 12px}
</style></head><body>
<div class="header"><div style="display:flex;align-items:center;gap:10px"><img src="logo.jpg" class="logo-box" onerror="this.style.display='none'"><div><h2 style="margin:0;color:gold;font-size:18px">সোণৰ অসম</h2><p style="margin:0;color:#aaa;font-size:10px">Official • Premium</p></div></div><div id="authArea"></div></div>
<div class="districts" id="districtList"></div><div id="feed"></div><div id="reelsFeed" style="display:none"></div>
<div id="profilePage"><div class="profileHeader">
<div style="display:flex;justify-content:space-between;margin-bottom:15px"><button onclick="closeProfile()" style="padding:7px 14px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #444">Back</button><button onclick="logout()" style="padding:7px 14px;border-radius:20px;background:#ff2222;color:#fff;border:0">Logout</button></div>
<div id="bigPicArea"></div><h2 id="profName" style="color:gold;margin:10px 0"></h2>
<button onclick="uploadProfile()" style="margin-top:6px;padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:800;border:0">📷 Profile Photo</button>
<div class="membership-card-premium" id="membershipCard"><div class="premium-inner">
<div style="text-align:center"><div style="font-size:26px">🪷</div><div style="color:#d4af37;font-size:18px;font-weight:700">Sonor Axom - সোণৰ অসম</div><div style="color:#c9a86a;font-size:11px;letter-spacing:4px;margin-top:5px">PREMIUM MEMBERSHIP</div></div>
<div style="text-align:center;margin:35px 0"><div id="cardName" style="color:#fff;font-size:26px;font-weight:900">Loading...</div><div style="display:flex;justify-content:center;gap:18px;margin-top:12px"><div><span style="color:#888;font-size:9px">DISTRICT</span><br><span id="cardDistrict" style="color:gold;font-weight:700">All Assam</span></div><div><span style="color:#888;font-size:9px">ID</span><br><span id="cardId" style="color:#fff;font-family:monospace">SA-0000</span></div><div><span style="color:#888;font-size:9px">SINCE</span><br><span id="cardSince" style="color:#aaa">2024</span></div></div><div id="cardQr" style="display:none"></div></div>
<div style="display:flex;justify-content:space-between;align-items:end"><div style="width:70px;height:70px;background:gold;border-radius:50%;border:3px solid #8B6914;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:7px;font-weight:900">EST. 2024</span><span style="font-size:16px">🪷</span><span style="font-size:7px;font-weight:900">EST. 2024</span></div><div style="flex:1;text-align:center"><p style="color:#d4af37;font-size:13px;margin:0">জয় আই অসম! সোণৰ অসমৰ সদস্য</p></div><div style="width:70px;height:70px;background:#000;border:3px solid gold;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:20px">👥</span><span style="color:gold;font-size:6px">SONOR AXOM</span></div></div>
</div></div>
<div class="statBox"><div><b id="myPostCount">0</b><span style="font-size:11px;color:#888">Posts</span></div><div><b id="myLikeCount">0</b><span style="font-size:11px;color:#888">Likes</span></div><div><b id="myCommentCount">0</b><span style="font-size:11px;color:#888">Comments</span></div></div>
</div><div style="padding:10px"><h3 style="color:gold;padding:0 10px">মোৰ Posts</h3><div id="myPosts"></div></div></div>
<div class="bottom-nav"><button class="active" onclick="switchTab('home',this)"><span class="icon">🏠</span>Home</button><button onclick="switchTab('reels',this)"><span class="icon">🎵</span>Reels</button><div class="upload-center" onclick="openReelsUpload()">+</div><button onclick="toggleInbox()"><span class="icon">💬</span>Inbox</button><button onclick="openProfilePage()"><span class="icon">👤</span>Profile</button></div>
<div id="reelsModal"><div class="reelsBox"><h3 style="color:gold;text-align:center">HD Reels Upload</h3><input type="file" id="reelFile" accept="video/*,audio/*" style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px"><input type="text" id="reelTitle" placeholder="গানৰ নাম" style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px"><select id="reelDist" style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px"></select><div class="progressBar" id="progBar"><div class="progressFill" id="progFill"></div></div><p id="uploadStatus" style="font-size:12px;color:#aaa;text-align:center"></p><div style="display:flex;gap:8px"><button onclick="closeReelsUpload()" style="flex:1;padding:10px;border-radius:20px;background:#222;color:#fff">Cancel</button><button onclick="uploadReelNow()" style="flex:1;padding:10px;border-radius:20px;background:gold;color:#000;font-weight:900">Upload</button></div></div></div>
<div id="privateBox"><div style="background:#000;padding:10px;display:flex;justify-content:space-between;color:gold;font-weight:900;border-bottom:2px solid gold"><span id="privateTitle">Inbox</span><div><span onclick="backToInbox()" style="cursor:pointer;margin-right:8px;font-size:11px;background:#222;padding:4px 8px;border-radius:10px">Inbox</span><span onclick="toggleInbox()" style="cursor:pointer">X</span></div></div><div id="inboxList" style="max-height:100px;overflow-y:auto;background:#0a0a0a;padding:6px"></div><div id="privateMessages" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#000"></div><div style="display:flex;gap:6px;padding:10px;background:#151515"><input id="privateText" placeholder="Message..." style="flex:1;padding:10px;border-radius:20px;border:2px solid gold"><button onclick="sendPrivate()" style="width:42px;height:42px;border-radius:50%;background:gold;border:0">></button></div></div>
<input type="file" id="profileFile" accept="image/*" style="display:none"><input type="file" id="postImageFile" accept="image/*" style="display:none">
<script>/* Firebase + Full Logic - SAME AS BEFORE - WORKING */
const firebaseConfig={apiKey:"AIzaSyDuJdr6IRg6U7FgQDIcZEG7IOMkinGxitI",authDomain:"sonor-assam.firebaseapp.com",projectId:"sonor-assam",storageBucket:"sonor-assam.appspot.com",messagingSenderId:"353015301976",appId:"1:353015301976:web:b7cc25039edb136a8c872d"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let currentUser=JSON.parse(localStorage.getItem('sonor_user')||'null');
function getProfileKey(){if(!currentUser)return 'sonor_profile_pic_guest';return 'sonor_profile_pic_'+(currentUser.phone||'')+'_'+(currentUser.name||'').toLowerCase().replace(/\s+/g,'');}
let profilePic="";function loadProfilePic(){profilePic=localStorage.getItem(getProfileKey())||"";}loadProfilePic();
let allPosts=[],allReels=[],privateTarget=null,inboxOpen=false,privateUnsub=null,currentTab='home',selectedPostImage="",postImageFileObj=null;
const allDistricts=["Bajali","Baksa","Barpeta","Biswanath","Bongaigaon","Cachar","Charaideo","Chirang","Darrang","Dhemaji","Dhubri","Dibrugarh","Dima Hasao","Goalpara","Golaghat","Hailakandi","Hojai","Jorhat","Kamrup","Kamrup Metro","Karbi Anglong","Karimganj","Kokrajhar","Lakhimpur","Majuli","Morigaon","Nagaon","Nalbari","Sivasagar","Sonitpur","South Salmara","Tamulpur","Tinsukia","Udalguri","West Karbi Anglong"];
document.getElementById('districtList').innerHTML='<button class="active" onclick="filterByDistrict(\'All\',this)">All Assam</button>'+allDistricts.map(d=>`<button onclick="filterByDistrict('${d}',this)">${d}</button>`).join('');
document.getElementById('reelDist').innerHTML='<option value="">জিলা</option>'+allDistricts.map(d=>`<option>${d}</option>`).join('');
let selectedDistrict="All";
function filterByDistrict(n,b){selectedDistrict=n;document.querySelectorAll('.districts button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderFeed();renderReels();}
function switchTab(t,e){currentTab=t;document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));if(e)e.classList.add('active');document.getElementById('feed').style.display=t==='home'?'block':'none';document.getElementById('reelsFeed').style.display=t==='reels'?'block':'none';if(t==='reels')renderReels();}
function openReelsUpload(){if(!currentUser){openAuth();return;}document.getElementById('reelsModal').style.display='flex';}
function closeReelsUpload(){document.getElementById('reelsModal').style.display='none';}
async function uploadReelNow(){const f=document.getElementById('reelFile').files[0];const tt=document.getElementById('reelTitle').value.trim();if(!f||!tt){alert('File + Title লাগে');return;}try{const fd=new FormData();fd.append('file',f);const r=await fetch('https://tmpfiles.org/api/v1/upload',{method:'POST',body:fd});let j=await r.json();let u=j.data?.url||"";if(u)u=u.replace('tmpfiles.org/','tmpfiles.org/dl/');await db.collection('reels').add({title:tt,url:u,district:document.getElementById('reelDist').value||selectedDistrict,userName:currentUser.name,userPhoto:profilePic||'',likes:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});closeReelsUpload();switchTab('reels',document.querySelectorAll('.bottom-nav button')[1]);}catch(e){alert('Error');}}
db.collection("reels").orderBy("createdAt","desc").limit(100).onSnapshot(s=>{allReels=[];s.forEach(d=>allReels.push({id:d.id,...d.data()}));if(currentTab==='reels')renderReels();});
function renderReels(){const feed=document.getElementById('reelsFeed');let f=selectedDistrict==="All"?allReels:allReels.filter(p=>p.district===selectedDistrict);feed.innerHTML=f.map(d=>`<div class="reel-card"><video src="${d.url}" controls style="width:100%"></video><div style="padding:10px"><b style="color:gold">${d.title}</b> • ${d.userName}</div></div>`).join('');}
function renderAuth(){loadProfilePic();const a=document.getElementById('authArea');if(currentUser){a.innerHTML=profilePic?`<img src="${profilePic}" class="profile-pic" onclick="openProfilePage()">`:`<div class="profile-pic" onclick="openProfilePage()">${currentUser.name[0]}</div>`;}else{a.innerHTML=`<button onclick="openAuth()" style="padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">Login</button>`;}}
function openAuth(){let n=prompt("নাম?");if(!n)return;let p=prompt("মোবাইল?");if(!p)return;currentUser={name:n.trim(),phone:p.trim()};localStorage.setItem('sonor_user',JSON.stringify(currentUser));loadProfilePic();renderAuth();renderFeed();}
function logout(){if(!confirm("Logout?"))return;localStorage.removeItem('sonor_user');currentUser=null;profilePic="";closeProfile();renderAuth();renderFeed();}
function uploadProfile(){document.getElementById('profileFile').click();}
document.getElementById('profileFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const b=await new Promise(r=>{let fr=new FileReader();fr.onload=ev=>r(ev.target.result);fr.readAsDataURL(f);});profilePic=b;localStorage.setItem(getProfileKey(),b);renderAuth();openProfilePage();renderFeed();});
function openProfilePage(){if(!currentUser){openAuth();return;}loadProfilePic();document.getElementById('profilePage').style.display='block';document.getElementById('bigPicArea').innerHTML=profilePic?`<img src="${profilePic}" class="bigPic">`:`<div class="bigPic" style="display:flex;align-items:center;justify-content:center;font-size:40px;background:#222;color:gold">${currentUser.name[0]}</div>`;document.getElementById('profName').innerText=currentUser.name;document.getElementById('cardName').innerText=currentUser.name;document.getElementById('cardDistrict').innerText=selectedDistrict;document.getElementById('cardId').innerText="SA-"+(currentUser.phone?currentUser.phone.slice(-4):"0000")+"-"+Math.floor(1000+Math.random()*9000);document.getElementById('cardSince').innerText=new Date().getFullYear();const my=allPosts.filter(p=>p.userName===currentUser.name);document.getElementById('myPostCount').innerText=my.length;document.getElementById('myLikeCount').innerText=my.reduce((s,p)=>s+(p.likes||0),0);document.getElementById('myCommentCount').innerText=my.reduce((s,p)=>s+(p.comments?.length||0),0);document.getElementById('myPosts').innerHTML=my.length?my.map(d=>`<div class="card"><p>${d.text||''}</p>${d.image?`<img src="${d.image}" style="width:100%;border-radius:12px">`:''}<br><button onclick="deletePost('${d.id}','${d.userName}')" style="background:#ff2222;color:#fff;border:0;border-radius:20px;padding:6px 12px">Delete</button></div>`).join(''):'<div class="card">Post নাই</div>';}
function closeProfile(){document.getElementById('profilePage').style.display='none';}
function deletePost(id,o){if(o!==currentUser.name){alert("নোৱাৰি");return;}db.collection("posts").doc(id).delete();}
function likePost(id,l){const k='liked_'+id;if(localStorage.getItem(k)){alert("Like কৰিছা");return;}db.collection("posts").doc(id).update({likes:(l||0)+1});localStorage.setItem(k,'1');}
async function commentPost(id){const t=prompt("Comment:");if(!t)return;const s=await db.collection("posts").doc(id).get();let c=s.data().comments||[];c.push({text:t,user:currentUser.name});await db.collection("posts").doc(id).update({comments:c});}
function toggleInbox(){inboxOpen=!inboxOpen;document.getElementById('privateBox').style.display=inboxOpen?'flex':'none';}
function openPrivateChat(t){privateTarget=t;document.getElementById('privateTitle').innerText=t;document.getElementById('privateBox').style.display='flex';}
function backToInbox(){privateTarget=null;document.getElementById('privateTitle').innerText="Inbox";}
function getConvId(a,b){return [a.trim().toLowerCase(),b.trim().toLowerCase()].sort().join("__");}
function listenPrivate(){if(!privateTarget||!currentUser)return;const convId=getConvId(currentUser.name,privateTarget);db.collection("private_messages").where("convId","==",convId).orderBy("createdAt","asc").onSnapshot(s=>{const box=document.getElementById('privateMessages');box.innerHTML="";s.forEach(doc=>{const d=doc.data();box.innerHTML+=`<div style="padding:8px 12px;border-radius:14px;${d.from===currentUser.name?'background:gold;color:#000':'background:#222;color:#fff'}">${d.text}</div>`;});});}
function sendPrivate(){const txt=document.getElementById('privateText').value.trim();if(!txt||!privateTarget)return;db.collection("private_messages").add({convId:getConvId(currentUser.name,privateTarget),from:currentUser.name,to:privateTarget,participants:[currentUser.name.toLowerCase(),privateTarget.toLowerCase()],text:txt,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('privateText').value="";}
db.collection("posts").orderBy("createdAt","desc").limit(100).onSnapshot(s=>{allPosts=[];s.forEach(d=>allPosts.push({id:d.id,...d.data()}));renderFeed();});
function renderFeed(){const feed=document.getElementById('feed');let f=selectedDistrict==="All"?allPosts:allPosts.filter(p=>p.district===selectedDistrict);feed.innerHTML=`<div class="card"><textarea id="postText" placeholder="কি ভাবিছা?" style="width:100%;min-height:60px;border-radius:12px;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333"></textarea><div style="display:flex;gap:6px;margin-top:8px"><select id="fDist" style="flex:1;padding:9px;border-radius:20px;border:2px solid gold;background:#fff;color:#000;font-weight:700"><option value="">জিলা</option>${allDistricts.map(d=>`<option ${d===selectedDistrict?'selected':''}>${d}</option>`).join('')}</select><button onclick="document.getElementById('postImageFile').click()" style="padding:9px 12px;border-radius:20px;background:#222;color:gold;border:1px solid gold">📷</button><button onclick="createPostReal()" style="padding:9px 16px;border-radius:20px;background:gold;color:#000;font-weight:900">Post</button></div><div id="postImgPreview"></div></div>`+f.map(d=>`<div class="card"><b>${d.userName}</b> • ${d.district}<p>${d.text||''}</p>${d.image?`<img src="${d.image}" style="width:100%;border-radius:12px">`:''}<div style="display:flex;gap:6px;margin-top:8px"><button onclick="likePost('${d.id}',${d.likes||0})" class="btn-action">❤️ ${d.likes||0}</button><button onclick="commentPost('${d.id}')" class="btn-action">💬 ${(d.comments||[]).length}</button></div></div>`).join('');}
async function createPostReal(){const t=document.getElementById('postText').value.trim();const dist=document.getElementById('fDist').value||selectedDistrict;if(!t&&!postImageFileObj){alert("লিখা");return;}let img="";if(postImageFileObj){const fd=new FormData();fd.append('file',postImageFileObj);try{const r=await fetch('https://tmpfiles.org/api/v1/upload',{method:'POST',body:fd});let j=await r.json();img=j.data?.url||"";if(img)img=img.replace('tmpfiles.org/','tmpfiles.org/dl/');}catch{}}await db.collection("posts").add({text:t,image:img,district:dist,likes:0,comments:[],userName:currentUser.name,userPhoto:profilePic||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('postText').value="";postImageFileObj=null;document.getElementById('postImgPreview').innerHTML="";}
document.getElementById('postImageFile').addEventListener('change',e=>{postImageFileObj=e.target.files[0];if(postImageFileObj){const fr=new FileReader();fr.onload=ev=>{document.getElementById('postImgPreview').innerHTML=`<img src="${ev.target.result}" style="width:100%;border-radius:12px">`;};fr.readAsDataURL(postImageFileObj);}});
renderAuth();
</script></body></html>
