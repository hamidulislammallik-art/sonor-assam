<!DOCTYPE html>
<html lang="as"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;padding-bottom:160px}
.header{padding:10px 14px;background:#0a0a0a;border-bottom:3px solid gold;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}

.card{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin:10px}
.btn-action{padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;border:1px solid #333;background:#1a1a1a;color:#fff}
#profilePage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:2000;display:none;overflow-y:auto}
.profileHeader{padding:20px;background:linear-gradient(180deg,#1a1a1a,#000);border-bottom:2px solid gold;text-align:center}
.bigPic{width:110px;height:110px;border-radius:50%;border:4px solid gold;object-fit:cover;margin:auto;background:#222;display:block}
.statBox{display:flex;justify-content:center;gap:12px;margin-top:15px}
.statBox div{background:#111;border:1px solid #222;border-radius:12px;padding:10px 16px;text-align:center;min-width:68px}
.statBox b{color:gold;font-size:18px;display:block}
.districts{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#080808;border-bottom:1px solid #111}

.districts button.active{background:gold;color:#000;font-weight:800}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:72px;background:#0a0a0a;border-top:2px solid gold;display:flex;justify-content:space-around;align-items:center;z-index:999999}
.bottom-nav button{background:transparent;border:0;color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:700}
.bottom-nav button.active{color:gold}
.bottom-nav button span.icon{font-size:22px}
.upload-center{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,gold,#ff8c00);border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;font-weight:900;margin-top:-28px;box-shadow:0 4px 15px rgba(255,215,0,0.7);cursor:pointer}
#reelsModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999999;display:none;align-items:center;justify-content:center;padding:15px}
.reelsBox{background:#111;border:2px solid gold;border-radius:18px;width:100%;max-width:380px;padding:18px}
.progressBar{width:100%;height:8px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px;display:none}
.progressFill{height:100%;background:gold;width:0%;transition:width 0.3s}
.reel-card{background:#111;border:1px solid gold;border-radius:16px;margin:10px;overflow:hidden}
#privateBox{position:fixed;bottom:80px;left:12px;width:92%;max-width:380px;height:460px;background:#111;border:2px solid gold;border-radius:18px;z-index:99998;display:none;flex-direction:column;overflow:hidden}
.membership-real{position:relative;width:100%;max-width:520px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 0 25px rgba(212,175,55,0.5);border:2px solid #d4af37;aspect-ratio:16/10;background:#000}
.singerFilter{white-space:nowrap}
</style></head><body>
<div class="header"><div style="display:flex;align-items:center;gap:10px"><img src="logo.jpg" class="logo-box" onerror="this.style.display='none'"><div><h2 style="margin:0;color:gold;font-size:18px">সোণৰ অসম</h2><p style="margin:0;color:#aaa;font-size:10px">Assamese + Bollywood Music</p></div></div><div id="authArea"></div></div>
<div class="districts" id="districtList"></div><div id="feed"></div><div id="reelsFeed" style="display:none"></div>
<div id="profilePage"><div class="profileHeader">
<div style="display:flex;justify-content:space-between;margin-bottom:15px"><button onclick="closeProfile()" style="padding:7px 14px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #444">Back</button><button onclick="logout()" style="padding:7px 14px;border-radius:20px;background:#ff2222;color:#fff;border:0">Logout</button></div>
<div id="bigPicArea"></div><h2 id="profName" style="color:gold;margin:10px 0"></h2>
<button onclick="uploadProfile()" style="margin-top:6px;padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:800;border:0">📷 Profile Photo</button>
<div style="padding:10px">
<div class="membership-real" id="membershipCard">
  <img src="card-bg.jpg" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.src='card-bg.png'">
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;">
    <div style="position:absolute;top:54%;left:50%;transform:translate(-50%,-50%);width:16.5%;aspect-ratio:1/1;border-radius:50%;border:2.5px solid #d4af37;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px gold">
      <img id="cardProfileImg" src="" style="width:100%;height:100%;object-fit:cover;display:none">
      <span id="cardProfileLetter" style="font-size:20px;font-weight:900;color:gold">H</span>
    </div>
    <div id="cardName" style="position:absolute;top:73%;left:50%;transform:translateX(-50%);color:#fff;font-size:11px;font-weight:800;text-align:center;text-shadow:0 1px 3px #000,0 0 6px gold;white-space:nowrap;background:rgba(0,0,0,0.72);padding:3px 14px;border-radius:10px;border:1px solid rgba(212,175,55,0.6)">Hamidul Islam</div>
  </div>
</div>
<div style="text-align:center;margin-top:12px">
  <button onclick="downloadCard()" style="padding:11px 24px;border-radius:25px;background:linear-gradient(135deg,gold,#ff8c00);color:#000;font-weight:900;border:0">⬇️ Download HD Card</button>
  <p style="color:#666;font-size:10px;margin-top:8px">ID: <span id="cardIdShow">SA-0000</span> • <span id="cardDistrictShow">All Assam</span></p>
</div>
</div>
<div class="statBox"><div><b id="myPostCount">0</b><span style="font-size:11px;color:#888">Posts</span></div><div><b id="myLikeCount">0</b><span style="font-size:11px;color:#888">Likes</span></div><div><b id="myCommentCount">0</b><span style="font-size:11px;color:#888">Comments</span></div></div>
</div><div style="padding:10px"><h3 style="color:gold;padding:0 10px">মোৰ Posts + Reels</h3><div id="myPosts"></div></div></div>
<div class="bottom-nav">
<button class="active" onclick="switchTab('home',this)"><span class="icon">🏠</span>Home</button>
<button onclick="switchTab('reels',this)"><span class="icon">🎵</span>Reels</button>
<div class="upload-center" onclick="openReelsUpload()">+</div>
<button onclick="toggleInbox()"><span class="icon">💬</span>Inbox</button>
<button onclick="openProfilePage()"><span class="icon">👤</span>Profile</button>
</div>
<div id="reelsModal"><div class="reelsBox">
<h3 style="color:gold;text-align:center;margin:0 0 12px 0">HD Reels Upload (FREE)</h3>
<input type="file" id="reelFile" accept="video/*" style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px">
<input type="text" id="reelTitle" placeholder="গানৰ নাম লিখা..." style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px">
<select id="reelDist" style="width:100%;padding:10px;border-radius:10px;background:#1a1a1a;color:#fff;border:1px solid #333;margin-bottom:10px"></select>
<div class="progressBar" id="progBar"><div class="progressFill" id="progFill"></div></div>
<p id="uploadStatus" style="font-size:12px;color:#aaa;text-align:center;margin:8px 0"></p>
<div style="display:flex;gap:8px"><button onclick="closeReelsUpload()" style="flex:1;padding:10px;border-radius:20px;background:#222;color:#fff;border:1px solid #444">Cancel</button><button onclick="uploadReelNow()" style="flex:1;padding:10px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">Upload</button></div>
</div></div>
<div id="privateBox"><div style="background:#000;padding:10px;display:flex;justify-content:space-between;color:gold;font-weight:900;border-bottom:2px solid gold"><span id="privateTitle">Inbox</span><div><span onclick="backToInbox()" style="cursor:pointer;margin-right:8px;font-size:11px;background:#222;padding:4px 8px;border-radius:10px">Inbox</span><span onclick="toggleInbox()" style="cursor:pointer">X</span></div></div><div id="inboxList" style="max-height:100px;overflow-y:auto;background:#0a0a0a;padding:6px"></div><div id="privateMessages" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#000"></div><div style="display:flex;gap:6px;padding:10px;background:#151515"><input id="privateText" placeholder="Message..." style="flex:1;padding:10px;border-radius:20px;border:2px solid gold"><button onclick="sendPrivate()" style="width:42px;height:42px;border-radius:50%;background:gold;border:0">></button></div></div>
<input type="file" id="profileFile" accept="image/*" style="display:none"><input type="file" id="postImageFile" accept="image/*" style="display:none"><input type="file" id="postAudioFile" accept="audio/*" style="display:none">
<script>
const firebaseConfig={apiKey:"AIzaSyDuJdr6IRg6U7FgQDIcZEG7IOMkinGxitI",authDomain:"sonor-assam.firebaseapp.com",projectId:"sonor-assam",storageBucket:"sonor-assam.appspot.com",messagingSenderId:"353015301976",appId:"1:353015301976:web:b7cc25039edb136a8c872d"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let currentUser=JSON.parse(localStorage.getItem('sonor_user')||'null');
function getProfileKey(){if(!currentUser)return 'sonor_profile_pic_guest';return 'sonor_profile_pic_'+(currentUser.phone||'');}
let profilePic="";function loadProfilePic(){profilePic=localStorage.getItem(getProfileKey())||"";}loadProfilePic();
let allPosts=[],allReels=[],privateTarget=null,inboxOpen=false,currentTab='home',selectedPostImage="",selectedPostAudio=null,selectedPostAudioUrl="";
const allDistricts=["Bajali","Baksa","Barpeta","Biswanath","Bongaigaon","Cachar","Charaideo","Chirang","Darrang","Dhemaji","Dhubri","Dibrugarh","Dima Hasao","Goalpara","Golaghat","Hailakandi","Hojai","Jorhat","Kamrup","Kamrup Metro","Karbi Anglong","Karimganj","Kokrajhar","Lakhimpur","Majuli","Morigaon","Nagaon","Nalbari","Sivasagar","Sonitpur","South Salmara","Tamulpur","Tinsukia","Udalguri","West Karbi Anglong"];
document.getElementById('districtList').innerHTML='<button class="active" onclick="filterByDistrict(\'All\',this)">All Assam</button>'+allDistricts.map(d=>`<button onclick="filterByDistrict('${d}',this)">${d}</button>`).join('');
document.getElementById('reelDist').innerHTML='<option value="">জিলা</option>'+allDistricts.map(d=>`<option>${d}</option>`).join('');
let selectedDistrict="All";

// === MUSIC LIBRARY - ASSAMESE + BOLLYWOOD ===
const assameseSongsLibrary = [
  {singer:'Zubeen', cat:'Assamese', title:'Mayabini - মায়াবিনী', url:''},
  {singer:'Zubeen', cat:'Assamese', title:'Pakhi - পখী', url:''},
  {singer:'Zubeen', cat:'Assamese', title:'Ya Ali - ইয়া আলি', url:''},
  {singer:'Zubeen', cat:'Assamese', title:'Anuradha - অনুৰাধা', url:''},
  {singer:'Papon', cat:'Assamese', title:'Sinaaki - সিনাকী', url:''},
  {singer:'Papon', cat:'Assamese', title:'Bota Diya', url:''},
  {singer:'Neel', cat:'Assamese', title:'Laisa - লাইচা', url:''},
  {singer:'Neel', cat:'Assamese', title:'Bhal Lage - ভাল লাগে', url:''},
  {singer:'Achurjya', cat:'Assamese', title:'Dure Dure - দূৰে দূৰে', url:''},
  {singer:'Babul', cat:'Assamese', title:'Buwali - বুৱলী', url:''},
  {singer:'Arijit', cat:'Bollywood', title:'Tum Hi Ho', url:''},
  {singer:'Arijit', cat:'Bollywood', title:'Kesariya', url:''},
  {singer:'Arijit', cat:'Bollywood', title:'Channa Mereya', url:''},
  {singer:'Arijit', cat:'Bollywood', title:'Apna Bana Le', url:''},
  {singer:'Shreya', cat:'Bollywood', title:'Manwa Laage', url:''},
  {singer:'Shreya', cat:'Bollywood', title:'Samjhawan', url:''},
  {singer:'Atif', cat:'Bollywood', title:'Dil Diyan Gallan', url:''},
  {singer:'Atif', cat:'Bollywood', title:'Jeene Laga Hoon', url:''},
  {singer:'Kishore', cat:'Bollywood', title:'Ek Pyar Ka Nagma', url:''},
  {singer:'Sonu', cat:'Bollywood', title:'Kal Ho Naa Ho', url:''},
];

function renderSongsList(filter='All'){
  const sel = document.getElementById('allSongsSelect');
  if(!sel) return;
  let filtered;
  if(filter==='All') filtered = assameseSongsLibrary;
  else if(filter==='Assamese' || filter==='Bollywood') filtered = assameseSongsLibrary.filter(s=>s.cat===filter);
  else filtered = assameseSongsLibrary.filter(s=>s.singer===filter);
  sel.innerHTML = '<option value="">🎵 '+filter+' - Select ('+filtered.length+')...</option>' + filtered.map(s=>`<option value="${s.url}|${s.title}">${s.singer} - ${s.title}</option>`).join('');
}
function filterSingers(name,btn){
  document.querySelectorAll('.singerFilter').forEach(b=>{b.style.background='#1a1a1a';b.style.color='#fff';});
  if(btn){btn.style.background='gold';btn.style.color='#000';}
  renderSongsList(name);
}
function selectAnySong(val){
  if(!val) return;
  let [url, title] = val.split('|');
  if(!url){
    alert('Boss এই গীতৰ MP3 Link এতিয়াও Add কৰা নাই!\n\nCatbox.moe ত Upload কৰি Library ত url Add কৰা:\n{singer:"Zubeen", title:"Mayabini", url:"https://files.catbox.moe/xyz.mp3"}');
    return;
  }
  selectedPostAudioUrl = url;
  selectedPostAudio = null;
  document.getElementById('postAudioPreview').innerHTML = `<div style="background:#1a1a1a;padding:8px 12px;border-radius:12px;border:1px solid #ff69b4;"><span style="color:#ff69b4;font-size:12px">🎵 ${title}</span><audio controls style="width:100%;margin-top:6px"><source src="${url}"></audio></div>`;
}

function filterByDistrict(n,b){selectedDistrict=n;document.querySelectorAll('.districts button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderFeed();renderReels();}
function switchTab(t,e){currentTab=t;document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));if(e) e.classList.add('active');if(t==='home'){document.getElementById('feed').style.display='block';document.getElementById('reelsFeed').style.display='none';renderFeed();}else{document.getElementById('feed').style.display='none';document.getElementById('reelsFeed').style.display='block';renderReels();}}
function openReelsUpload(){if(!currentUser){openAuth();return;}document.getElementById('reelsModal').style.display='flex';}
function closeReelsUpload(){document.getElementById('reelsModal').style.display='none';document.getElementById('uploadStatus').innerText='';document.getElementById('progBar').style.display='none';}
function compressImage(file, maxW, quality){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',quality));};img.src=e.target.result;};r.readAsDataURL(file);});}
function isVideoUrl(url){if(!url) return false; return url.startsWith('data:video') || url.includes('.mp4') || url.includes('.webm') || url.includes('catbox');}
async function uploadReelNow(){
  const file=document.getElementById('reelFile').files[0];
  const title=document.getElementById('reelTitle').value.trim();
  const status=document.getElementById('uploadStatus');
  const bar=document.getElementById('progBar');
  const fill=document.getElementById('progFill');
  if(!file){alert('Video Select কৰা!');return;}
  if(!title){alert('গানৰ নাম লিখা!');return;}
  if(file.size>150000000){alert('150MB তকৈ ডাঙৰ!');return;}
  bar.style.display='block';fill.style.width='20%';status.innerText='Uploading (FREE)...';
  try{
    let fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',file);
    fill.style.width='50%';
    let resp=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});
    let url=(await resp.text()).trim();
    if(!url.startsWith('http')) throw new Error('Catbox busy');
    fill.style.width='85%';status.innerText='Saving...';
    await db.collection('reels').add({title:title,url:url,type:'video',district:document.getElementById('reelDist').value||selectedDistrict,userName:currentUser.name,userPhoto:profilePic||'',likes:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    fill.style.width='100%';status.innerText='SUCCESS!';
    setTimeout(()=>{closeReelsUpload();document.getElementById('reelFile').value='';document.getElementById('reelTitle').value='';switchTab('reels',document.querySelectorAll('.bottom-nav button')[1]);},800);
  }catch(e){status.innerText='Failed: '+e.message;alert(e.message);bar.style.display='none';}
}
db.collection("reels").orderBy("createdAt","desc").limit(100).onSnapshot(s=>{allReels=[];s.forEach(d=>allReels.push({id:d.id,...d.data()}));if(currentTab==='reels')renderReels();if(document.getElementById('profilePage').style.display==='block')openProfilePage();});
function renderReels(){
  const feed=document.getElementById('reelsFeed');
  let filtered=selectedDistrict==="All"?allReels:allReels.filter(p=>p.district===selectedDistrict);
  if(!filtered.length){feed.innerHTML='<div class="card" style="text-align:center;color:#888;padding:30px">Reels নাই - + ত ক্লিক কৰি Video দিয়া</div>';return;}
  feed.innerHTML=filtered.map(d=>`<div class="reel-card"><video src="${d.url}" controls playsinline preload="metadata" style="width:100%;max-height:600px;background:#000"></video><div style="padding:10px;display:flex;justify-content:space-between"><div><b style="color:gold">${d.title}</b><br><span style="font-size:11px;color:#888">${d.userName} • ${d.district||''}</span></div><button onclick="likeReel('${d.id}',${d.likes||0})" style="background:#1a1a1a;border:1px solid gold;border-radius:20px;padding:6px 12px;color:gold">❤️ ${d.likes||0}</button></div></div>`).join('');
}
function likeReel(id,l){if(!currentUser){openAuth();return;}if(localStorage.getItem('liked_reel_'+id))return;db.collection("reels").doc(id).update({likes:(l||0)+1});localStorage.setItem('liked_reel_'+id,'1');}
function renderAuth(){loadProfilePic();const a=document.getElementById('authArea');if(currentUser){a.innerHTML=profilePic?`<img src="${profilePic}" class="profile-pic" onclick="openProfilePage()">`:`<div class="profile-pic" onclick="openProfilePage()">${currentUser.name[0]}</div>`;}else{a.innerHTML=`<button onclick="openAuth()" style="padding:8px 16px;border-radius:20px;background:gold;color:#000;font-weight:900;border:0">Login</button>`;}}
function openAuth(){let n=prompt("নাম?");if(!n)return;let p=prompt("মোবাইল?");if(!p)return;currentUser={name:n.trim(),phone:p.trim()};localStorage.setItem('sonor_user',JSON.stringify(currentUser));loadProfilePic();renderAuth();renderFeed();}
function logout(){if(!confirm("Logout?"))return;localStorage.removeItem('sonor_user');currentUser=null;profilePic="";closeProfile();renderAuth();renderFeed();}
function uploadProfile(){if(!currentUser){openAuth();return;}document.getElementById('profileFile').click();}
document.getElementById('profileFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let c=await compressImage(f,400,0.85);profilePic=c;try{localStorage.setItem(getProfileKey(),c);}catch{localStorage.clear();localStorage.setItem('sonor_user',JSON.stringify(currentUser));localStorage.setItem(getProfileKey(),c);}renderAuth();openProfilePage();renderFeed();});
function getStableMemberId(){if(!currentUser)return "SA-0000";let s=localStorage.getItem('sonor_member_id_'+currentUser.phone);if(s)return s;let nid=`SA-${(currentUser.phone||'0000').slice(-4)}-${(currentUser.name||'AX').substring(0,2).toUpperCase()}${Math.floor(100+Math.random()*900)}`;localStorage.setItem('sonor_member_id_'+currentUser.phone,nid);return nid;}
function openProfilePage(){
  if(!currentUser){openAuth();return;}
  loadProfilePic();
  document.getElementById('profilePage').style.display='block';
  document.getElementById('bigPicArea').innerHTML=profilePic?`<img src="${profilePic}" class="bigPic">`:`<div class="bigPic" style="display:flex;align-items:center;justify-content:center;font-size:50px;background:gold;color:#000;font-weight:900">${currentUser.name[0]}</div>`;
  document.getElementById('profName').innerText=currentUser.name;
  let myPosts=allPosts.filter(p=>p.userName===currentUser.name);
  let myReels=allReels.filter(p=>p.userName===currentUser.name);
  document.getElementById('myPostCount').innerText=myPosts.length + myReels.length;
  document.getElementById('myLikeCount').innerText=myPosts.reduce((s,p)=>s+(p.likes||0),0)+myReels.reduce((s,p)=>s+(p.likes||0),0);
  document.getElementById('myCommentCount').innerText=myPosts.reduce((s,p)=>s+(p.comments?.length||0),0);
  let combined=[...myReels.map(r=>({...r, isReel:true})), ...myPosts.map(p=>({...p, isReel:false}))];
  document.getElementById('myPosts').innerHTML=combined.length?combined.map(d=>{
    let media='';
    if(d.isReel){
      media=`<video src="${d.url}" controls playsinline style="width:100%;border-radius:12px;max-height:500px;background:#000"></video><p style="color:gold;font-size:12px">🎵 ${d.title}</p>`;
    } else {
      if(d.image){
        if(isVideoUrl(d.image)) media+=`<video src="${d.image}" controls playsinline style="width:100%;border-radius:12px;max-height:500px;background:#000"></video>`;
        else media+=`<img src="${d.image}" style="width:100%;border-radius:12px">`;
      }
      if(d.audio) media+=`<div style="margin-top:8px;background:#1a1a1a;border:1px solid #ff69b4;border-radius:12px;padding:8px"><p style="margin:0 0 6px 0;color:#ff69b4;font-size:11px">🎵 Attached Song</p><audio controls style="width:100%"><source src="${d.audio}"></audio></div>`;
    }
    return `<div class="card"><p>${d.text||d.title||''}</p>${media}<br><button onclick="${d.isReel?`deleteReel('${d.id}','${d.userName}')`:`deletePost('${d.id}','${d.userName}')`}" style="background:#ff2222;color:#fff;border:0;border-radius:20px;padding:6px 12px">Delete</button></div>`;
  }).join(''):'<div class="card" style="text-align:center">Post নাই</div>';

    if(cpImg) cpImg.style.display='none';

}

async function downloadCard(){
  const cardBg = document.querySelector('#membershipCard img');
  const btn = document.querySelector('button[onclick="downloadCard()"]');
  if(!cardBg){ alert('card-bg.jpg নাই!'); return; }
  if(!currentUser){ alert('Login কৰা!'); return; }
  btn.innerText='⏳ Creating HD...';
  const bgSrc = cardBg.src;
  const name = currentUser.name;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1600; canvas.height = 1000;
  const bgImg = new Image(); bgImg.crossOrigin='anonymous';
  bgImg.onload = () => {
    ctx.drawImage(bgImg,0,0,canvas.width,canvas.height);
    const photoX = canvas.width/2;
    const photoY = canvas.height*0.535;
    const photoR = (canvas.width*0.165)/2;
    function drawCover(img,x,y,r){
      ctx.save();
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
      const ir = img.width/img.height;
      let sx,sy,sW,sH;
      if(ir>1){ sH=img.height; sW=sH; sx=(img.width-sW)/2; sy=0; }
      else{ sW=img.width; sH=sW; sx=0; sy=(img.height-sH)/2; }
      ctx.drawImage(img,sx,sy,sW,sH,x-r,y-r,r*2,r*2);
      ctx.restore();
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.strokeStyle='#d4af37'; ctx.lineWidth=6; ctx.stroke();
    }
    const drawName = () => {
      const nameY = canvas.height*0.735;
      ctx.font='bold 46px Arial'; ctx.textAlign='center';
      const textW = ctx.measureText(name).width;
      ctx.fillStyle='rgba(0,0,0,0.75)';
      ctx.beginPath(); ctx.roundRect(canvas.width/2-textW/2-35,nameY-32,textW+70,48,22); ctx.fill();
      ctx.strokeStyle='rgba(212,175,55,0.6)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.shadowColor='gold'; ctx.shadowBlur=10;
      ctx.fillText(name,canvas.width/2,nameY+2); ctx.shadowBlur=0;
      const link=document.createElement('a');
      link.download=`Sonor-Axom-${name.replace(/\s/g,'_')}-FINAL.png`;
      link.href=canvas.toDataURL('image/png',1.0); link.click();
      btn.innerText='⬇️ Download HD Card';
    };
    if(profilePic){
      const pImg=new Image();
      pImg.onload=()=>{ drawCover(pImg,photoX,photoY,photoR); drawName(); };
      pImg.onerror=drawName; pImg.src=profilePic;
    }else{
      ctx.beginPath(); ctx.arc(photoX,photoY,photoR,0,Math.PI*2);
      ctx.fillStyle='#000'; ctx.fill(); ctx.strokeStyle='#d4af37'; ctx.lineWidth=6; ctx.stroke();
      ctx.fillStyle='gold'; ctx.font='bold 80px Arial'; ctx.textAlign='center';
      ctx.fillText(name[0].toUpperCase(),photoX,photoY+24); drawName();
    }
  };
  bgImg.onerror=()=>{alert('card-bg.jpg load fail'); btn.innerText='⬇️ Download HD Card';};
  bgImg.src=bgSrc;
}
function deletePost(id,o){if(o!==currentUser.name){alert("আনৰ Post নোৱাৰি!");return;}if(confirm("Delete?"))db.collection("posts").doc(id).delete();}

  <div id="postImgPreview" style="margin-top:8px"></div><div id="postAudioPreview" style="margin-top:8px"></div></div>`+filtered.map(d=>{
    let liked=localStorage.getItem('liked_'+d.id);
    let avatar=d.userPhoto?`<img src="${d.userPhoto}" style="width:30px;height:30px;border-radius:50%;border:1px solid gold">`:`<div style="width:30px;height:30px;border-radius:50%;background:gold;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900">${(d.userName||'U')[0]}</div>`;

  let imgInp=document.getElementById('postImageFile');

  let audInp=document.getElementById('postAudioFile');

async function createPostReal(){
  if(!currentUser){openAuth();return;}
  let txtEl=document.getElementById('postText');let txt=txtEl?txtEl.value.trim():"";
  let dist=document.getElementById('fDist')?document.getElementById('fDist').value||selectedDistrict:selectedDistrict;
  if(!txt && !selectedPostImage && !selectedPostAudio && !selectedPostAudioUrl){alert("লিখা, Photo বা গীত দিয়া!");return;}
  if(txtEl) txtEl.placeholder="Uploading...";
  try{
    let audioUrl = selectedPostAudioUrl || "";
    if(selectedPostAudio && !audioUrl){
      let fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',selectedPostAudio);
      let resp=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});
      audioUrl=(await resp.text()).trim();
      if(!audioUrl.startsWith('http')) throw new Error('Audio upload fail');
    }
    await db.collection("posts").add({text:txt,image:selectedPostImage||"",audio:audioUrl||"",district:dist,likes:0,comments:[],userName:currentUser.name,userPhoto:profilePic||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    if(txtEl){txtEl.value="";txtEl.placeholder="কি ভাবিছা? Photo + গীত Add কৰা!";}
    clearPostImage();clearPostAudio();
  }catch(err){alert('Error: '+err.message); if(txtEl) txtEl.placeholder="কি ভাবিছা?";}
}
