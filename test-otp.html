<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Test - Free</title>
<style>
body{font-family:Arial;max-width:400px;margin:30px auto;padding:20px;background:#fff}
input,button{padding:12px;margin:8px 0;width:100%;font-size:16px;box-sizing:border-box}
button{background:#ff6600;color:#fff;border:none;border-radius:6px}
.otp-display{background:yellow;padding:15px;font-size:28px;text-align:center;margin:15px 0;border:2px dashed red;letter-spacing:6px;font-weight:bold}
.error{color:red;font-weight:bold}.success{color:green;font-weight:bold}
</style>
</head>
<body>
<h2>OTP Test - Sonor Assam</h2>
<p style="color:green">FREE System - No Billing / No Card</p>
<input type="text" id="phone" value="+919854401319">
<button onclick="sendOTP()">OTP পঠিয়াওক</button>
<div id="otpBox" style="display:none">
<div class="otp-display" id="otpShow"></div>
<p style="font-size:13px">Test ৰ বাবে OTP ওপৰত দেখাইছে। Live ত Free SMS লগাম।</p>
<input type="text" id="otpInput" placeholder="OTP Code">
<button onclick="verifyOTP()">Verify</button>
</div>
<div id="msg"></div>
<script>
let generatedOTP="", phoneNumber="";
function sendOTP(){
  const phone=document.getElementById('phone').value.trim();
  if(!phone){document.getElementById('msg').innerHTML='<p class=error>Number দিয়া</p>';return;}
  generatedOTP=Math.floor(100000+Math.random()*900000).toString();
  phoneNumber=phone;
  document.getElementById('otpBox').style.display='block';
  document.getElementById('otpShow').innerText=generatedOTP;
  document.getElementById('msg').innerHTML='<p class=success>OTP Generated! OTP টো হলুদীয়া Box ত আছে</p>';
  localStorage.setItem('sonor_otp_'+phone,generatedOTP);
  localStorage.setItem('sonor_user_phone',phone);
}
function verifyOTP(){
  const input=document.getElementById('otpInput').value.trim();
  if(input===generatedOTP){
    document.getElementById('msg').innerHTML='<p class=success>✅ Verified! '+phoneNumber+' Login Success!</p>';
    localStorage.setItem('sonor_user',phoneNumber);
    setTimeout(()=>{window.location.href='index.html';},1000);
  }else{
    document.getElementById('msg').innerHTML='<p class=error>❌ ভুল OTP! সঠিক: '+generatedOTP+'</p>';
  }
}
</script>
</body>
</html>
